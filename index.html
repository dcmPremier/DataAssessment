  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

}\n<\u002Fstyle>\n<style>/* fallback */\n@font-face {\n  font-family: 'Material Symbols Outlined';\n  font-style: normal;\n  font-weight: 400;\n  src: url(\"a066221a-a8d8-4a9d-972e-c8cb135037dd\") format('woff2');\n}\n\n.material-symbols-outlined {\n  font-family: 'Material Symbols Outlined';\n  font-weight: normal;\n  font-style: normal;\n  font-size: 24px;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-smoothing: antialiased;\n}\n<\u002Fstyle>\n\n<style>\n/* ── Tokens (Definian Design System) ──────────────────────────── */\n:root {\n  --def-midnight:  #02072D;\n  --def-deep:      #04102B;\n  --def-ink:       #0B1640;\n  --def-blue:      #0D2C71;\n  --def-green:     #00AB63;\n  --def-green-bright: #00FF99;\n  --def-green-600: #009055;\n  --def-green-200: #99DEC2;\n  --def-cool-gray: #D8D7EE;\n  --def-dark-gray: #3C405B;\n  --def-white:     #FFFFFF;\n  --def-mist:      #F6F6F8;\n\n  --font-display: 'Inter Tight', system-ui, -apple-system, sans-serif;\n  --font-sans:    'Inter Tight', system-ui, -apple-system, sans-serif;\n\n  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);\n  --ease-io:  cubic-bezier(0.4, 0, 0.2, 1);\n\n  --particle-speed: 18s;\n}\n\n/* Material Symbols ligature rendering */\n.ms {\n  font-family: 'Material Symbols Outlined';\n  font-weight: 400;\n  font-style: normal;\n  line-height: 1;\n  letter-spacing: normal;\n  text-transform: none;\n  display: inline-block;\n  white-space: nowrap;\n  word-wrap: normal;\n  direction: ltr;\n  -webkit-font-feature-settings: 'liga';\n  font-feature-settings: 'liga';\n  -webkit-font-smoothing: antialiased;\n}\n\n* { margin: 0; padding: 0; box-sizing: border-box; }\nhtml, body { background: var(--def-midnight); color: var(--def-white); font-family: var(--font-sans); min-height: 100vh; -webkit-font-smoothing: antialiased; }\nbody { overflow-x: hidden; }\na { color: inherit; text-decoration: none; }\nbutton { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }\nem { font-style: italic; }\n\n/* Subtle bg texture — angled-squares feel from brand guide, very low opacity */\n.bgtex {\n  position: fixed; inset: 0; z-index: 0; pointer-events: none;\n  background:\n    radial-gradient(circle at 20% 20%, rgba(0, 171, 99, 0.06), transparent 40%),\n    radial-gradient(circle at 80% 60%, rgba(0, 171, 99, 0.04), transparent 50%);\n}\n\n/* ── Top bar ─────────────────────────────────────────────────── */\n.topbar {\n  position: sticky; top: 0; z-index: 50;\n  display: flex; align-items: center; gap: 20px;\n  padding: 18px 40px;\n  background: rgba(2, 7, 45, 0.86);\n  backdrop-filter: blur(12px) saturate(180%);\n  -webkit-backdrop-filter: blur(12px) saturate(180%);\n  border-bottom: 1px solid var(--def-dark-gray);\n}\n.topbar .brand { display: inline-flex; align-items: center; }\n.topbar .brand img { height: 22px; width: auto; display: block; }\n.topbar nav { margin-left: auto; display: flex; align-items: center; gap: 26px; }\n.topbar nav a {\n  font-family: var(--font-display);\n  font-size: 14px; font-weight: 400; letter-spacing: 0.005em;\n  color: var(--def-cool-gray); opacity: 0.78;\n  transition: opacity 160ms ease, color 160ms ease;\n}\n.topbar nav a:hover, .topbar nav a.is-current { opacity: 1; color: var(--def-white); }\n.topbar nav a.is-current { color: var(--def-green); }\n.topbar nav .cta {\n  padding: 8px 18px;\n  background: var(--def-green); color: var(--def-white);\n  border-radius: 4px; font-weight: 600; opacity: 1;\n  transition: background 160ms ease, transform 160ms ease;\n}\n.topbar nav .cta:hover { background: var(--def-green-600); transform: translateY(-1px); }\n.topbar .nav-toggle { display: none; }\n\n/* ── Page views (Assessment / How We Work) ──────────────────── */\n.page-view { display: none; position: relative; z-index: 1; }\n.page-view.is-active { display: block; }\n\n/* ── Hero ────────────────────────────────────────────────────── */\n.hero {\n  max-width: 1440px; margin: 0 auto;\n  padding: 64px 40px 24px;\n}\n.eyebrow {\n  display: inline-flex; align-items: center; gap: 12px;\n  color: var(--def-green);\n  font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;\n}\n.eyebrow::before { content: \"\"; width: 28px; height: 1px; background: var(--def-green); }\n.hero h1 {\n  font-family: var(--font-display);\n  font-size: clamp(36px, 5.4vw, 64px);\n  line-height: 1.05; letter-spacing: -0.02em; font-weight: 600;\n  margin: 18px 0 18px; max-width: 1020px;\n  text-wrap: balance;\n}\n.hero h1 em { font-style: normal; color: var(--def-green); }\n.hero .sub {\n  font-size: clamp(16px, 1.4vw, 19px); line-height: 1.6;\n  color: var(--def-cool-gray); max-width: 760px;\n}\n.hero .cues {\n  margin-top: 28px;\n  display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;\n  color: var(--def-cool-gray); font-size: 13px;\n}\n.hero .cues .cue { display: inline-flex; align-items: center; gap: 8px; opacity: 0.7; }\n.hero .cues .cue .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--def-green); box-shadow: 0 0 8px var(--def-green); }\n.hero .cues .cue.tip { font-style: italic; opacity: 0.5; }\n\n/* ── Pipeline ────────────────────────────────────────────────── */\n.pipeline-wrap {\n  position: relative;\n  max-width: 1440px; margin: 0 auto;\n  padding: 36px 40px 24px;\n}\n.track {\n  position: absolute; left: 64px; right: 64px; top: 84px; height: 2px;\n  background: linear-gradient(90deg, rgba(0,171,99,0) 0%, rgba(0,171,99,0.5) 6%, rgba(0,171,99,0.5) 94%, rgba(0,171,99,0) 100%);\n  pointer-events: none;\n}\n.track::after {\n  content: \"\"; position: absolute; inset: -1px 0; height: 4px; top: -1px;\n  background: linear-gradient(90deg, transparent 0%, rgba(0,255,153,0) 0%, rgba(0,255,153,0.9) 50%, rgba(0,255,153,0) 100%);\n  background-size: 30% 100%;\n  animation: trackPulse var(--particle-speed) linear infinite;\n  filter: blur(2px);\n}\n@keyframes trackPulse {\n  0%   { background-position: -30% 0; }\n  100% { background-position: 130% 0; }\n}\n.particles {\n  position: absolute; left: 64px; right: 64px; top: 80px; height: 12px;\n  pointer-events: none; overflow: hidden;\n}\n.particle {\n  position: absolute; left: 0; top: 4px;\n  width: 5px; height: 5px; border-radius: 50%;\n  background: var(--def-green-bright);\n  box-shadow: 0 0 12px var(--def-green-bright), 0 0 4px var(--def-green-bright);\n  opacity: 0.7;\n  animation: particleFlow var(--particle-speed) linear infinite;\n}\n@keyframes particleFlow {\n  0%   { transform: translateX(-20px); opacity: 0; }\n  10%  { opacity: 1; }\n  90%  { opacity: 1; }\n  100% { transform: translateX(calc(100vw - 200px)); opacity: 0; }\n}\n\n.pipeline {\n  position: relative;\n  display: grid;\n  gap: 14px;\n  padding-top: 44px;\n}\n.pipeline.cols-6 { grid-template-columns: repeat(6, 1fr); }\n.pipeline.cols-5 { grid-template-columns: repeat(5, 1fr); }\n.pipeline.cols-4 { grid-template-columns: repeat(4, 1fr); }\n\n.phase {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  padding-top: 56px;\n}\n.phase .node {\n  position: absolute; left: 50%; top: 5px;\n  transform: translate(-50%, -50%);\n  width: 14px; height: 14px; border-radius: 50%;\n  background: var(--def-green);\n  box-shadow:\n    0 0 0 4px rgba(0, 171, 99, 0.18),\n    0 0 18px rgba(0, 171, 99, 0.55);\n  z-index: 2;\n  pointer-events: none;\n  transition: transform 250ms var(--ease-out), box-shadow 250ms ease;\n  animation: nodePulse 2.4s ease-in-out infinite;\n}\n@keyframes nodePulse {\n  0%, 100% {\n    box-shadow:\n      0 0 0 4px rgba(0, 171, 99, 0.18),\n      0 0 16px rgba(0, 171, 99, 0.50);\n  }\n  50% {\n    box-shadow:\n      0 0 0 8px rgba(0, 171, 99, 0.10),\n      0 0 26px rgba(0, 171, 99, 0.75);\n  }\n}\n.phase:hover .node, .phase.is-open .node {\n  transform: translate(-50%, -50%) scale(1.25);\n  animation-play-state: paused;\n  box-shadow:\n    0 0 0 8px rgba(0, 171, 99, 0.22),\n    0 0 32px rgba(0, 171, 99, 0.80);\n}\n.phase.is-open .node {\n  background: var(--def-green);\n}\n\n.phase .card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  flex: 1;\n  padding: 22px 20px 20px;\n  background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.015));\n  border: 1px solid var(--def-dark-gray);\n  border-radius: 10px;\n  cursor: pointer;\n  min-height: 240px;\n  overflow: hidden;\n  transition: border-color 200ms ease, transform 280ms var(--ease-out), background 280ms ease, box-shadow 280ms ease;\n}\n.phase .card::before {\n  content: \"\"; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;\n  background: var(--def-green); opacity: 0.6;\n  transition: opacity 200ms ease, width 200ms ease;\n}\n.phase:hover .card {\n  border-color: rgba(0, 171, 99, 0.7);\n  background: linear-gradient(180deg, rgba(0,171,99,0.10), rgba(0,171,99,0.02));\n  transform: translateY(-4px);\n  box-shadow:\n    0 16px 40px rgba(0, 0, 0, 0.35),\n    0 0 0 1px rgba(0, 171, 99, 0.35),\n    0 0 32px rgba(0, 171, 99, 0.18);\n}\n.phase:hover .card::before { opacity: 1; width: 4px; box-shadow: 0 0 12px rgba(0, 255, 153, 0.6); }\n.phase:hover .num { color: var(--def-green-bright, #00FF99); text-shadow: 0 0 12px rgba(0, 255, 153, 0.4); }\n.phase.is-open .card {\n  border-color: var(--def-green);\n  background: linear-gradient(180deg, rgba(0,171,99,0.12), rgba(255,255,255,0.02));\n  box-shadow: 0 0 0 1px rgba(0, 171, 99, 0.4), 0 12px 32px rgba(0, 0, 0, 0.35);\n}\n\n.phase .num {\n  font-family: var(--font-display);\n  font-size: 38px; line-height: 1; font-weight: 300;\n  color: var(--def-green); letter-spacing: -0.01em;\n}\n.phase .name {\n  font-family: var(--font-display);\n  font-size: 18px; line-height: 1.22; font-weight: 600;\n  color: var(--def-white); margin-top: 10px;\n  letter-spacing: -0.01em;\n  text-wrap: balance;\n}\n.phase .tag {\n  color: var(--def-cool-gray); font-size: 12.5px; line-height: 1.5; margin-top: 14px; opacity: 0.78;\n  border-top: 1px solid rgba(216, 215, 238, 0.08);\n  padding-top: 12px;\n  font-style: italic;\n}\n.phase .meta {\n  margin-top: auto;\n  padding-top: 14px;\n  display: flex; align-items: center; justify-content: space-between; gap: 8px;\n  color: var(--def-cool-gray); font-size: 11px; letter-spacing: 0.04em;\n  text-transform: uppercase; opacity: 0.65;\n  min-width: 0;\n}\n.phase .meta .count {\n  display: inline-flex; align-items: center; gap: 6px;\n  white-space: nowrap;\n  min-width: 0;\n  overflow: hidden;\n  text-overflow: ellipsis;\n}\n.phase .meta .count b { color: var(--def-green); font-weight: 700; font-size: 13px; }\n.phase .meta .open-cue {\n  display: inline-flex; align-items: center;\n  color: var(--def-cool-gray); opacity: 0.7;\n  flex-shrink: 0;\n  font-size: 0;  /* hide \"Open\" text node; arrow alone carries the affordance */\n  transition: color 200ms ease, opacity 200ms ease;\n}\n.phase .meta .open-cue::after {\n  content: \"→\"; font-size: 14px; line-height: 1;\n  transition: transform 240ms var(--ease-out);\n}\n.phase:hover .meta .open-cue, .phase.is-open .meta .open-cue {\n  color: var(--def-green); opacity: 1;\n}\n.phase.is-open .meta .open-cue::after { transform: rotate(90deg); }\n\n/* ── Drawer ──────────────────────────────────────────────────── */\n.drawer-wrap {\n  max-width: 1440px; margin: 0 auto;\n  padding: 0 40px;\n  position: relative;\n}\n.drawer {\n  position: relative;\n  overflow: hidden;\n  max-height: 0;\n  opacity: 0;\n  transition: max-height 520ms var(--ease-out), opacity 320ms ease, margin 320ms ease;\n  margin-top: 0;\n}\n.drawer.is-open {\n  max-height: 4800px; /* generous; collapsed via JS measurement if needed */\n  opacity: 1;\n  margin-top: 16px;\n  margin-bottom: 40px;\n}\n.drawer-card {\n  position: relative;\n  background: linear-gradient(180deg, rgba(0, 171, 99, 0.06), rgba(255, 255, 255, 0.012));\n  border: 1px solid rgba(0, 171, 99, 0.35);\n  border-radius: 14px;\n  padding: 36px 36px 32px;\n}\n.drawer-card::before {\n  content: \"\"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%) rotate(45deg);\n  width: 18px; height: 18px;\n  background: linear-gradient(135deg, rgba(0,171,99,0.4), rgba(0,171,99,0.05));\n  border-left: 1px solid rgba(0, 171, 99, 0.35);\n  border-top: 1px solid rgba(0, 171, 99, 0.35);\n}\n.drawer-head {\n  display: grid; grid-template-columns: 1fr auto; gap: 36px;\n  padding-bottom: 22px;\n  border-bottom: 1px solid rgba(216, 215, 238, 0.1);\n  margin-bottom: 28px;\n}\n.drawer-head .left {\n  display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap;\n}\n.drawer-head .num2 {\n  font-family: var(--font-display);\n  font-size: clamp(40px, 4.4vw, 56px); line-height: 1; font-weight: 300;\n  color: var(--def-green); letter-spacing: -0.02em;\n}\n.drawer-head .name2 {\n  font-family: var(--font-display);\n  font-size: clamp(22px, 2.2vw, 30px); line-height: 1.15; font-weight: 600;\n  color: var(--def-white); letter-spacing: -0.01em;\n  text-wrap: balance;\n}\n.drawer-head .blurb2 {\n  width: 100%;\n  font-size: 16px; line-height: 1.65;\n  color: var(--def-cool-gray); opacity: 0.88;\n  max-width: 820px;\n  margin-top: 6px;\n}\n.drawer-head .closebtn {\n  align-self: start;\n  width: 36px; height: 36px;\n  border-radius: 50%;\n  border: 1px solid var(--def-dark-gray);\n  display: inline-flex; align-items: center; justify-content: center;\n  color: var(--def-cool-gray);\n  transition: border-color 160ms ease, color 160ms ease, background 160ms ease;\n}\n.drawer-head .closebtn:hover { border-color: var(--def-green); color: var(--def-green); background: rgba(0, 171, 99, 0.05); }\n.drawer-head .closebtn svg { display: block; }\n\n.drawer-stats {\n  display: flex; gap: 28px; flex-wrap: wrap;\n  margin-bottom: 28px;\n}\n.drawer-stats .stat {\n  display: flex; flex-direction: column; gap: 4px;\n  min-width: 0;\n}\n.drawer-stats .stat .v {\n  font-family: var(--font-display);\n  font-size: 28px; line-height: 1; font-weight: 300;\n  color: var(--def-green);\n}\n.drawer-stats .stat .l {\n  font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;\n  color: var(--def-cool-gray); opacity: 0.6;\n}\n\n/* Thesis line that appears in drawer (e.g., section 4) */\n.drawer-thesis {\n  font-family: var(--font-display);\n  font-size: clamp(20px, 2vw, 26px); line-height: 1.4; font-weight: 500;\n  color: var(--def-white); letter-spacing: -0.005em;\n  border-left: 2px solid var(--def-green);\n  padding: 16px 24px;\n  margin: 8px 0 32px;\n  background: rgba(0, 171, 99, 0.04);\n  border-radius: 0 6px 6px 0;\n}\n.drawer-thesis em { font-style: normal; color: var(--def-green); font-weight: 600; }\n\n/* Paragraph under the thesis (e.g., Applaud's pre-validation body). */\n.drawer-thesis-body {\n  margin: -24px 0 32px;\n  padding: 0 0 0 26px;\n}\n.drawer-thesis-body p {\n  color: var(--def-cool-gray); font-size: 16px; line-height: 1.65; opacity: 0.88;\n  max-width: 820px;\n}\n\n/* Closing thesis blockquote — emphasized terminus that closes a phase.\n   (Was used inline within the 'get' drawer; the line has been promoted to\n    the page-level .page-thesis block below. CSS kept for potential reuse.) */\n.drawer-close-thesis {\n  margin: 44px auto 4px;\n  padding: 36px 28px 4px;\n  max-width: 880px;\n  text-align: center;\n  position: relative;\n}\n.drawer-close-thesis::before {\n  content: \"\";\n  position: absolute;\n  top: 0; left: 50%;\n  transform: translateX(-50%);\n  width: 56px; height: 2px;\n  background: var(--def-green);\n  opacity: 0.85;\n}\n.drawer-close-thesis .lede {\n  display: block;\n  font-family: var(--font-display);\n  font-size: clamp(19px, 1.9vw, 24px);\n  line-height: 1.4; font-weight: 400;\n  color: var(--def-cool-gray);\n  letter-spacing: -0.005em;\n  opacity: 0.78;\n  margin: 0 auto 10px;\n  max-width: 760px;\n}\n.drawer-close-thesis .punch {\n  display: block;\n  font-family: var(--font-display);\n  font-size: clamp(24px, 2.6vw, 32px);\n  line-height: 1.28; font-weight: 600;\n  color: var(--def-white);\n  letter-spacing: -0.018em;\n  max-width: 820px;\n  margin: 0 auto;\n}\n.drawer-close-thesis .punch em {\n  font-style: normal; color: var(--def-green);\n}\n\n/* Page-level thesis block — lifted out of the drawer so the punchline is\n   visible regardless of which phase the user is reading. Sits between the\n   doctrine drawer and the outcomes stat-strip. Page-level scale (bigger\n   than the in-drawer thesis), centered, with a brand-green accent rule. */\n.page-thesis {\n  padding: 84px 40px 36px;\n  text-align: center;\n  position: relative;\n  z-index: 1;\n}\n.page-thesis-inner {\n  max-width: 980px;\n  margin: 0 auto;\n  position: relative;\n  padding-top: 38px;\n}\n.page-thesis-inner::before {\n  content: \"\";\n  position: absolute;\n  top: 0; left: 50%;\n  transform: translateX(-50%);\n  width: 72px; height: 2px;\n  background: var(--def-green);\n  opacity: 0.9;\n}\n.page-thesis .lede {\n  display: block;\n  font-family: var(--font-display);\n  font-size: clamp(20px, 2vw, 26px);\n  line-height: 1.4; font-weight: 400;\n  color: var(--def-cool-gray);\n  letter-spacing: -0.005em;\n  opacity: 0.72;\n  margin: 0 auto 18px;\n  max-width: 820px;\n}\n.page-thesis .punch {\n  display: block;\n  font-family: var(--font-display);\n  font-size: clamp(30px, 3.4vw, 46px);\n  line-height: 1.18; font-weight: 600;\n  color: var(--def-white);\n  letter-spacing: -0.022em;\n  max-width: 920px;\n  margin: 0 auto;\n}\n.page-thesis .punch em {\n  font-style: normal; color: var(--def-green);\n}\n\n/* How-we-work bridge card — quiet handoff from page 1 to the How We Work\n   page. Sits between the stat-strip and the contact section. Restrained\n   styling: hairline border, no fill, arrow link. */\n.hww-bridge {\n  padding: 48px 40px 56px;\n}\n.hww-bridge-inner {\n  max-width: 1100px; margin: 0 auto;\n  display: grid;\n  grid-template-columns: 1fr auto;\n  gap: 36px;\n  align-items: center;\n  padding: 32px 36px;\n  border: 1px solid var(--def-dark-gray);\n  border-radius: 12px;\n  background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));\n  transition: border-color 240ms ease, background 240ms ease;\n}\n.hww-bridge-inner:hover { border-color: rgba(0, 171, 99, 0.45); }\n.hww-bridge-eyebrow {\n  font-family: var(--font-display);\n  font-size: 12px; font-weight: 600;\n  color: var(--def-green);\n  text-transform: uppercase; letter-spacing: 0.12em;\n  margin-bottom: 12px;\n}\n.hww-bridge h3 {\n  font-family: var(--font-display);\n  font-size: clamp(22px, 2.2vw, 28px);\n  line-height: 1.25; font-weight: 600;\n  color: var(--def-white);\n  letter-spacing: -0.012em;\n  margin-bottom: 8px;\n}\n.hww-bridge p {\n  font-size: 15px; line-height: 1.6;\n  color: var(--def-cool-gray); opacity: 0.78;\n  max-width: 640px;\n}\n.hww-bridge-link {\n  display: inline-flex; align-items: center; gap: 10px;\n  padding: 14px 22px;\n  border: 1px solid var(--def-green);\n  border-radius: 6px;\n  color: var(--def-green);\n  font-family: var(--font-display);\n  font-size: 14px; font-weight: 600;\n  letter-spacing: 0.005em;\n  white-space: nowrap;\n  transition: background 200ms ease, color 200ms ease, transform 200ms var(--ease-out);\n}\n.hww-bridge-link:hover {\n  background: var(--def-green); color: var(--def-white);\n  transform: translateY(-1px);\n}\n.hww-bridge-link .arr {\n  display: inline-block;\n  transition: transform 200ms var(--ease-out);\n}\n.hww-bridge-link:hover .arr { transform: translateX(3px); }\n\n/* Multi-paragraph drawer blurb (V1 verbatim) */\n.blurb2 p { margin: 0; }\n.blurb2 p + p { margin-top: 12px; }\n\n/* Flowing prose drawer (sections 2 and 3 — V1 wrote these as paragraphs). */\n.drawer-prose { margin-bottom: 28px; max-width: 880px; }\n.drawer-prose p {\n  color: var(--def-cool-gray); font-size: 16px; line-height: 1.7; opacity: 0.92;\n  margin: 0 0 1.1em 0;\n}\n.drawer-prose p:last-child { margin-bottom: 0; }\n.drawer-prose p em { color: var(--def-white); font-style: italic; }\n\n/* Emphasized callout line (e.g., section 2 closing). */\n.drawer-callout {\n  font-family: var(--font-display);\n  font-size: clamp(18px, 1.8vw, 22px);\n  line-height: 1.45;\n  font-weight: 500;\n  color: var(--def-white);\n  letter-spacing: -0.005em;\n  border-left: 2px solid var(--def-green);\n  padding: 14px 22px;\n  margin: 0 0 32px;\n  background: rgba(0, 171, 99, 0.04);\n  border-radius: 0 6px 6px 0;\n  max-width: 880px;\n  text-wrap: balance;\n}\n\n/* Lead-in paragraph above items (e.g., section 4 \"We don't separate...\"). */\n.drawer-pre {\n  margin: 0 0 24px;\n  max-width: 880px;\n}\n.drawer-pre p {\n  color: var(--def-cool-gray); font-size: 16px; line-height: 1.65; opacity: 0.88;\n  margin: 0;\n}\n\n/* Closing paragraph below items (e.g., section 4 \"The transformation is the moment.\"). */\n.drawer-closing {\n  margin: 28px 0 0;\n  padding-top: 24px;\n  border-top: 1px solid rgba(216, 215, 238, 0.08);\n  max-width: 880px;\n}\n.drawer-closing p {\n  color: var(--def-cool-gray); font-size: 15.5px; line-height: 1.7; opacity: 0.85;\n  margin: 0;\n}\n\n/* Scope panel (Method §04 — What's in / what's out). */\n.scope-panel {\n  display: grid; grid-template-columns: 1fr 1fr; gap: 0;\n  margin-top: 28px;\n  border: 1px solid rgba(216, 215, 238, 0.12);\n  border-radius: 10px;\n  overflow: hidden;\n}\n.scope-col { padding: 24px 26px; }\n.scope-col.includes { background: rgba(0, 171, 99, 0.06); border-right: 1px solid rgba(216, 215, 238, 0.10); }\n.scope-col.excludes { background: rgba(255, 255, 255, 0.02); }\n.scope-label {\n  font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;\n  color: var(--def-green); margin-bottom: 14px;\n}\n.scope-col.excludes .scope-label { color: var(--def-cool-gray); opacity: 0.7; }\n.scope-col ul {\n  list-style: none; padding: 0; margin: 0;\n}\n.scope-col ul li {\n  position: relative;\n  padding: 10px 0 10px 22px;\n  color: var(--def-cool-gray);\n  font-size: 14.5px; line-height: 1.55;\n  border-bottom: 1px solid rgba(216, 215, 238, 0.06);\n}\n.scope-col ul li:last-child { border-bottom: 0; }\n.scope-col.includes ul li::before {\n  content: \"✓\"; color: var(--def-green); font-weight: 700;\n  position: absolute; left: 0; top: 10px;\n}\n.scope-col.excludes ul li::before {\n  content: \"✕\"; color: var(--def-cool-gray); opacity: 0.5;\n  position: absolute; left: 0; top: 10px;\n}\n@media (max-width: 720px) {\n  .scope-panel { grid-template-columns: 1fr; }\n  .scope-col.includes { border-right: 0; border-bottom: 1px solid rgba(216, 215, 238, 0.10); }\n}\n\n/* Static activity card (no deep content — no chevron, no hover lift, no click). */\n.act.no-expand {\n  cursor: default;\n}\n.act.no-expand:hover {\n  border-color: rgba(216, 215, 238, 0.10);\n  background: rgba(255, 255, 255, 0.025);\n}\n.act.no-expand:hover::before {\n  background: var(--def-cool-gray);\n  opacity: 0.25;\n}\n\n/* Activity list */\n.activities {\n  display: grid; grid-template-columns: 1fr; gap: 10px;\n}\n.act {\n  position: relative;\n  background: rgba(255, 255, 255, 0.025);\n  border: 1px solid rgba(216, 215, 238, 0.10);\n  border-radius: 8px;\n  padding: 18px 22px 18px 28px;\n  cursor: pointer;\n  transition: border-color 200ms ease, background 200ms ease, transform 200ms ease;\n}\n.act::before {\n  content: \"\"; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px;\n  background: var(--def-cool-gray); opacity: 0.25;\n  transition: background 200ms ease, opacity 200ms ease;\n}\n.act:hover {\n  border-color: rgba(0, 171, 99, 0.45);\n  background: rgba(0, 171, 99, 0.04);\n}\n.act:hover::before { background: var(--def-green); opacity: 1; }\n.act.is-open {\n  border-color: rgba(0, 171, 99, 0.6);\n  background: rgba(0, 171, 99, 0.06);\n}\n.act.is-open::before { background: var(--def-green); opacity: 1; }\n.act .row1 {\n  display: flex; align-items: center; justify-content: space-between; gap: 16px;\n}\n.act .nm {\n  font-family: var(--font-display);\n  font-size: 17px; font-weight: 600; line-height: 1.3;\n  color: var(--def-white); letter-spacing: -0.005em;\n}\n.act .chevron {\n  width: 24px; height: 24px;\n  display: inline-flex; align-items: center; justify-content: center;\n  color: var(--def-cool-gray); opacity: 0.6;\n  transition: transform 280ms var(--ease-out), color 200ms ease, opacity 200ms ease;\n}\n.act:hover .chevron, .act.is-open .chevron { color: var(--def-green); opacity: 1; }\n.act.is-open .chevron { transform: rotate(90deg); }\n.act .chevron svg { display: block; }\n.act .desc {\n  margin-top: 6px;\n  color: var(--def-cool-gray); font-size: 14.5px; line-height: 1.55; opacity: 0.85;\n}\n.act .more {\n  display: grid; grid-template-rows: 0fr;\n  transition: grid-template-rows 480ms var(--ease-out), margin-top 320ms ease;\n  margin-top: 0;\n}\n.act.is-open .more { grid-template-rows: 1fr; margin-top: 16px; }\n.act .more > .inner { overflow: hidden; min-height: 0; }\n.act .more .deep {\n  padding-top: 12px;\n  border-top: 1px solid rgba(216, 215, 238, 0.08);\n  color: var(--def-cool-gray); font-size: 14.5px; line-height: 1.65;\n}\n.act .more .deep p { margin: 0 0 0.9em 0; }\n.act .more .deep p:last-child { margin-bottom: 0; }\n.act .more .deep em { color: var(--def-white); font-style: italic; }\n\n/* Analytical Lens mapping matrix — used in The Methodology > Analytical Lens.\n   A 2x2 grid showing finding → signal patterns and the questions they pose. */\n.lens-matrix {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 14px;\n  margin: 16px 0 22px;\n}\n.lens-pattern {\n  padding: 16px 18px;\n  border: 1px solid var(--def-dark-gray);\n  border-radius: 8px;\n  background: rgba(255, 255, 255, 0.025);\n  display: flex; flex-direction: column;\n  gap: 8px;\n}\n.lens-pattern .lp-finding {\n  font-family: var(--font-display);\n  font-size: 14px; font-weight: 600;\n  color: var(--def-white);\n  letter-spacing: -0.005em;\n  line-height: 1.3;\n}\n.lens-pattern .lp-signal {\n  font-size: 13px; line-height: 1.5;\n  color: var(--def-cool-gray); opacity: 0.78;\n}\n.lens-pattern .lp-arrow {\n  color: var(--def-green); font-weight: 700;\n  margin: 0 4px;\n}\n.lens-pattern .lp-target {\n  color: var(--def-green); font-weight: 600;\n  font-style: normal;\n}\n.lens-pattern .lp-question {\n  font-size: 13px; line-height: 1.45;\n  color: var(--def-cool-gray); opacity: 0.62;\n  font-style: italic;\n  border-top: 1px dashed rgba(216, 215, 238, 0.14);\n  padding-top: 10px;\n  margin: 4px 0 0;\n}\n@media (max-width: 720px) {\n  .lens-matrix { grid-template-columns: 1fr; }\n}\n\n/* Compact 5-dim grid inside the evaluate drawer */\n.dim-grid {\n  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;\n  margin-bottom: 16px;\n}\n.dim-tile {\n  position: relative;\n  padding: 16px 14px 16px;\n  border: 1px solid rgba(216, 215, 238, 0.12);\n  border-radius: 8px;\n  background: rgba(255, 255, 255, 0.02);\n  cursor: pointer;\n  transition: border-color 200ms ease, background 200ms ease, transform 240ms ease;\n}\n.dim-tile:hover, .dim-tile.is-active { border-color: rgba(0, 171, 99, 0.55); background: rgba(0, 171, 99, 0.06); transform: translateY(-2px); }\n.dim-tile .dnum { font-family: var(--font-display); font-size: 11px; letter-spacing: 0.12em; color: var(--def-green); font-weight: 700; }\n.dim-tile .dname { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--def-white); margin-top: 6px; line-height: 1.25; }\n.dim-tile.is-active::after {\n  content: \"\"; position: absolute; left: 8px; right: 8px; top: -1px; height: 2px;\n  background: var(--def-green); border-radius: 2px;\n}\n.dim-detail {\n  padding: 18px 22px;\n  border: 1px solid rgba(0, 171, 99, 0.25);\n  border-radius: 8px;\n  background: rgba(0, 171, 99, 0.04);\n  margin-bottom: 18px;\n}\n.dim-detail .dlabel { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--def-green); margin-bottom: 6px; }\n.dim-detail .dtext { color: var(--def-cool-gray); font-size: 15px; line-height: 1.6; }\n.dim-detail .dtext + .dlabel { margin-top: 16px; }\n\n/* ===== Dimensional spine (V3 reimagining of V2's arc diagram) ===== */\n.dim-spine-wrap {\n  position: relative;\n  margin: 24px 0 28px;\n  padding: 40px 24px 180px;\n  background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.005));\n  border: 1px solid rgba(216, 215, 238, 0.08);\n  border-radius: 10px;\n  /* No overflow:hidden — the longer-range arcs need room to curve and\n     return without being clipped. */\n}\n.dim-spine { position: relative; }\n.dim-spine .cx-baseline {\n  position: absolute;\n  left: 8px; right: 8px;\n  top: 26px;\n  height: 1px;\n  background: linear-gradient(90deg, rgba(0,171,99,0) 0%, rgba(0,171,99,0.45) 8%, rgba(0,171,99,0.45) 92%, rgba(0,171,99,0) 100%);\n  pointer-events: none;\n}\n.dim-spine .cx-baseline::after {\n  content: \"\"; position: absolute; inset: -1px 0; height: 3px; top: -1px;\n  background: linear-gradient(90deg, transparent 0%, rgba(0,255,153,0) 0%, rgba(0,255,153,0.9) 50%, rgba(0,255,153,0) 100%);\n  background-size: 25% 100%;\n  animation: trackPulse var(--particle-speed) linear infinite;\n  filter: blur(2px);\n}\n.dim-spine .cx-row {\n  position: relative;\n  display: grid;\n  grid-template-columns: auto 1fr auto 1fr auto 1fr auto 1fr auto;\n  align-items: start;\n  gap: 4px;\n  padding-top: 12px;\n}\n.dim-spine .cx-dim {\n  display: flex; flex-direction: column; align-items: center;\n  padding: 0 8px;\n  background: none; border: 0; cursor: pointer; color: inherit;\n  text-align: center;\n}\n.dim-spine .cx-dim:focus-visible { outline: 2px solid var(--def-green); outline-offset: 6px; border-radius: 4px; }\n.dim-spine .cx-dim-num {\n  font-family: var(--font-display);\n  font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em;\n  color: var(--def-green); opacity: 0.7;\n  margin-bottom: 4px;\n  transition: opacity 200ms ease;\n}\n.dim-spine .cx-dim:hover .cx-dim-num,\n.dim-spine .cx-dim.is-active .cx-dim-num,\n.dim-spine .cx-dim.is-flank .cx-dim-num { opacity: 1; }\n.dim-spine .cx-dim-dot {\n  width: 14px; height: 14px; border-radius: 999px;\n  background: var(--def-midnight);\n  border: 2px solid var(--def-green);\n  box-shadow: 0 0 0 4px rgba(0, 171, 99, 0.10), 0 0 18px rgba(0, 171, 99, 0.40);\n  transition: background 220ms var(--ease-out), transform 220ms var(--ease-out), box-shadow 220ms ease;\n}\n.dim-spine .cx-dim:hover .cx-dim-dot {\n  background: var(--def-green);\n  transform: scale(1.12);\n  box-shadow: 0 0 0 6px rgba(0, 171, 99, 0.18), 0 0 24px rgba(0, 171, 99, 0.6);\n}\n.dim-spine .cx-dim.is-active .cx-dim-dot {\n  background: var(--def-green);\n  transform: scale(1.18);\n  box-shadow: 0 0 0 8px rgba(0, 171, 99, 0.24), 0 0 32px rgba(0, 171, 99, 0.85);\n}\n.dim-spine .cx-dim.is-flank .cx-dim-dot {\n  background: var(--def-green);\n}\n.dim-spine .cx-dim-name {\n  margin-top: 14px;\n  font-family: var(--font-display);\n  font-size: 12.5px; font-weight: 600; line-height: 1.25;\n  color: var(--def-cool-gray); opacity: 0.82;\n  max-width: 110px;\n  letter-spacing: 0;\n  text-wrap: balance;\n  transition: color 200ms ease, opacity 200ms ease;\n}\n.dim-spine .cx-dim:hover .cx-dim-name,\n.dim-spine .cx-dim.is-active .cx-dim-name,\n.dim-spine .cx-dim.is-flank .cx-dim-name { color: var(--def-white); opacity: 1; }\n\n/* Primary crossings — small arrow + label between dimensions on the baseline */\n.dim-spine .cx-prim {\n  display: flex; flex-direction: column; align-items: center;\n  padding: 0; margin-top: 5px;\n  background: none; border: 0; cursor: pointer; color: inherit;\n}\n.dim-spine .cx-prim:focus-visible { outline: 2px solid var(--def-green); outline-offset: 6px; border-radius: 4px; }\n.dim-spine .cx-prim-arrow {\n  width: 12px; height: 12px;\n  background: rgba(216, 215, 238, 0.35);\n  clip-path: polygon(0 40%, 60% 40%, 60% 0, 100% 50%, 60% 100%, 60% 60%, 0 60%);\n  transition: background 200ms ease, transform 200ms ease;\n}\n.dim-spine .cx-prim:hover .cx-prim-arrow,\n.dim-spine .cx-prim.is-open .cx-prim-arrow {\n  background: var(--def-green);\n  transform: scale(1.18);\n}\n.dim-spine .cx-prim-label {\n  margin-top: 28px;\n  font-family: var(--font-display);\n  font-size: 10px; font-weight: 700; letter-spacing: 0.14em;\n  color: var(--def-cool-gray); opacity: 0.5;\n  text-transform: uppercase;\n  white-space: nowrap;\n  transition: color 200ms ease, opacity 200ms ease;\n}\n.dim-spine .cx-prim:hover .cx-prim-label,\n.dim-spine .cx-prim.is-open .cx-prim-label { color: var(--def-green); opacity: 1; }\n\n/* Secondary arcs SVG */\n.dim-spine .cx-arcs {\n  position: absolute;\n  left: 8px; right: 8px;\n  top: 32px;\n  width: calc(100% - 16px);\n  height: 260px;\n  pointer-events: none;\n  overflow: visible;\n}\n.dim-spine .cx-arc-group { pointer-events: none; opacity: 0; transition: opacity 280ms ease; }\n.dim-spine .cx-arc-group.is-revealed { pointer-events: auto; opacity: 1; }\n.dim-spine .cx-arc-hit { fill: none; stroke: transparent; stroke-width: 22; cursor: pointer; }\n.dim-spine .cx-arc {\n  fill: none;\n  stroke: rgba(216, 215, 238, 0.42);\n  stroke-width: 1;\n  stroke-linecap: round;\n  transition: stroke 220ms ease, stroke-width 220ms ease;\n}\n.dim-spine .cx-arc-group.is-revealed .cx-arc {\n  stroke-dasharray: 1;\n  stroke-dashoffset: 1;\n  animation: arcDrawIn 900ms var(--ease-out) forwards;\n}\n@keyframes arcDrawIn { to { stroke-dashoffset: 0; } }\n.dim-spine .cx-arc-group.is-revealed:hover .cx-arc { stroke: var(--def-green); stroke-width: 2; }\n.dim-spine .cx-arc-group.is-open .cx-arc {\n  stroke: var(--def-green); stroke-width: 2.5;\n  filter: drop-shadow(0 0 4px rgba(0, 255, 153, 0.6));\n}\n.dim-spine .cx-arc-label {\n  fill: rgba(216, 215, 238, 0.55);\n  font-family: var(--font-display);\n  font-size: 9.5px; font-weight: 700;\n  letter-spacing: 0.14em; text-transform: uppercase;\n  text-anchor: middle;\n  opacity: 0;\n  transition: opacity 280ms ease, fill 220ms ease;\n}\n.dim-spine .cx-arc-group.is-revealed .cx-arc-label { opacity: 1; transition-delay: 360ms; }\n.dim-spine .cx-arc-group.is-revealed:hover .cx-arc-label,\n.dim-spine .cx-arc-group.is-open .cx-arc-label { fill: var(--def-green); opacity: 1; }\n\n.cx-arc-hint {\n  position: absolute;\n  left: 50%; bottom: 24px;\n  transform: translateX(-50%);\n  font-family: var(--font-display);\n  font-size: 11px; letter-spacing: 0.08em;\n  color: var(--def-cool-gray); opacity: 0.5;\n  white-space: nowrap;\n  pointer-events: none;\n  font-style: italic;\n  transition: opacity 260ms ease;\n}\n.dim-spine.has-active-dim ~ .cx-arc-hint { opacity: 0; }\n\n/* Spine detail panel — used by dim / primary / secondary crossings */\n.dim-detail .dim-empty {\n  font-size: 13.5px;\n  color: var(--def-cool-gray); opacity: 0.55;\n  margin: 0; padding: 6px 0;\n  font-style: italic;\n}\n.dim-detail .dim-kind {\n  font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;\n  color: var(--def-green); opacity: 0.85;\n  margin-bottom: 10px;\n}\n.dim-detail .dim-title {\n  font-family: var(--font-display);\n  font-size: clamp(20px, 2vw, 24px); line-height: 1.2; font-weight: 600;\n  color: var(--def-white); letter-spacing: -0.005em;\n  margin: 0 0 14px 0;\n  text-wrap: balance;\n}\n.dim-detail .dim-body p {\n  color: var(--def-cool-gray);\n  font-size: 15px; line-height: 1.65; opacity: 0.9;\n  margin: 0 0 12px 0;\n}\n.dim-detail .dim-body p:last-child { margin-bottom: 0; }\n.dim-detail .dim-body em { color: var(--def-white); font-style: italic; }\n.dim-detail .dd {\n  display: grid; grid-template-columns: 132px 1fr; gap: 16px;\n  margin: 14px 0;\n  align-items: baseline;\n}\n.dim-detail .dd-label {\n  font-size: 10.5px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;\n  color: var(--def-green); opacity: 0.75;\n}\n.dim-detail .dd-text {\n  color: var(--def-cool-gray);\n  font-size: 14.5px; line-height: 1.65; opacity: 0.9;\n}\n@media (max-width: 720px) {\n  .dim-detail .dd { grid-template-columns: 1fr; gap: 4p  center;\n  padding: 26px 22px;\n  border: 1px solid var(--def-dark-gray); border-radius: 14px;\n  background: rgba(2,7,45,.55);\n  transition: border-color 280ms ease, background 280ms ease, box-shadow 280ms ease;\n}\n.diff-half-icon { width: 52px; height: 52px; border-radius: 11px; border: 1px solid rgba(0,171,99,.45); display: inline-flex; align-items: center; justify-content: center; color: var(--def-green); margin-bottom: 14px; transition: background 280ms ease; }\n.diff-half-icon .ms { font-size: 28px; }\n.diff-half-kind { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--def-green); opacity: .8; }\n.diff-half-nm { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: var(--def-white); margin-top: 6px; line-height: 1.22; letter-spacing: -.005em; }\n.diff-half-sub { font-size: 12.5px; line-height: 1.5; color: var(--def-cool-gray); opacity: .7; margin-top: 8px; max-width: 230px; }\n.diff.flow-data .diff-half.data, .diff.flow-org .diff-half.org { border-color: var(--def-green); background: rgba(0,171,99,.12); box-shadow: 0 0 0 1px rgba(0,171,99,.4), 0 0 28px rgba(0,171,99,.18); }\n.diff.flow-data .diff-half.data .diff-half-icon, .diff.flow-org .diff-half.org .diff-half-icon { background: rgba(0,171,99,.18); }\n.diff-link { position: relative; width: 72px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }\n.diff-link-line { position: absolute; left: 8px; right: 8px; top: 50%; height: 2px; margin-top: -1px; background: linear-gradient(90deg, rgba(0,171,99,.5), rgba(0,255,153,.7), rgba(0,171,99,.5)); }\n.diff-arrow { font-size: 17px; line-height: 1; color: rgba(0,171,99,.4); position: relative; transition: color 220ms ease, transform 220ms ease; }\n.diff.flow-data .diff-arrow.fwd, .diff.flow-org .diff-arrow.back { color: var(--def-green-bright); transform: scale(1.25); }\n.diff-dot { position: absolute; top: 50%; left: 10px; width: 8px; height: 8px; percase; color: var(--def-green); border: 1px solid rgba(0,171,99,.4); border-radius: 999px; padding: 4px 11px; }\n.dtile-name { font-family: var(--font-display); font-size: 16px; font-weight: 600; line-height: 1.25; letter-spacing: -.005em; color: var(--def-white); margin-top: 14px; text-wrap: balance; }\n.dtile-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 440ms var(--ease-out), margin-top 300ms ease; margin-top: 0; }\n.dtile:hover .dtile-body, .dtile.is-open .dtile-body { grid-template-rows: 1fr; margin-top: 10px; }\n.dtile-body-inner { overflow: hidden; min-height: 0; }\n.dtile-body p { color: var(--def-cool-gray); font-size: 13.5px; line-height: 1.6; opacity: .85; margin: 0; }\n.dtile.is-feature { grid-column: 1 / -1; border-color: rgba(0,171,99,.5); background: linear-gradient(120deg, rgba(0,171,99,.12), rgba(255,255,255,.015)); }\n.dtile.is-feature .dtile-cue { display: none; }\n.dtile.is-feature .dtile-name { font-size: 19px; }\n.dtile.is-feature .dtile-body { grid-template-rows: 1fr; margin-top: 12px; }\n.dtile.is-feature .dtile-body p { font-size: 15px; max-width: 760px; }\n\n@media (max-width: 980px) {\n  .pillars { grid-template-columns: 1fr; }\n  .dashboard { grid-template-columns: repeat(2, 1fr); }\n  .diff-activations { grid-template-columns: 1fr; }\n}\n@media (max-width: 720px) {\n  .contrast-grid { grid-template-columns: 1fr; gap: 14px; }\n  .contrast-vs { padding: 0; }\n  .contrast-vs span { transform: rotate(0deg); }\n  .diff-venn { grid-template-columns: 1fr; gap: 0; }\n  .diff-link { width: auto; height: 56px; flex-direction: row; }\n  .diff-link-line { left: 50%; right: auto; top: 8px; bottom: 8px; width: 2px; height: auto; margin: 0; background: linear-gradient(180deg, rgba(0,171,99,.5), rgba(0,255,153,.7), rgba(0,171,99,.5)); }\n  @keyframes flowR { 0%{top:6px;left:50%;opacity:0} 14%{opacity:1} 86%{opacity:1} 100%{top:calc(100% - 6px);opacity:0} }\n  @keyframes flowL { 0%{top:calc(100% - 6px);left:50%;opacity:0} 14%{opacity:1} 86%{opacity:1} 100%{top:6px;opacity:0} }\n  .dashboard { grid-template-columns: 1fr; }\n}\n\n/* ── Stat strip ──────────────────────────────────────────────── */\n.stat-strip {\n  max-width: 1440px; margin: 0 auto;\n  padding: 64px 40px 48px;\n}\n.stat-strip-inner {\n  padding: 36px 36px;\n  border: 1px solid rgba(216, 215, 238, 0.12);\n  border-radius: 14px;\n  background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.005));\n}\n.stat-strip-eyebrow {\n  font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase;\n  color: var(--def-green); margin-bottom: 24px;\n}\n.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }\n.stat-row .stat-num {\n  font-family: var(--font-display);\n  font-size: clamp(44px, 5vw, 68px); font-weight: 300; line-height: 1;\n  color: var(--def-white); letter-spacing: -0.02em;\n  font-variant-numeric: tabular-nums;\n}\n.stat-row .stat-num .pct { font-size: 0.45em; color: var(--def-green); margin-left: 0.04em; }\n.stat-row .stat-lbl {\n  margin-top: 12px;\n  font-size: 14px; color: var(--def-white); opacity: 0.95;\n}\n.stat-row .stat-ctx {\n  margin-top: 6px;\n  font-size: 13px; color: var(--def-cool-gray); opacity: 0.7; line-height: 1.5;\n}\n\n/* ── Contact ─────────────────────────────────────────────────── */\n.contact {\n  max-width: 1440px; margin: 0 auto;\n  padding: 24px 40px 96px;\n  text-align: center;\n}\n.contact h3 {\n  font-family: var(--font-display);\n  font-size: clamp(24px, 2.8vw, 36px); line-height: 1.2; font-weight: 600;\n  color: var(--def-white); margin-bottom: 16px; letter-spacing: -0.01em;\n  text-wrap: balance;\n}\n.contact p {\n  font-size: 16px; line-height: 1.6; color: var(--def-cool-gray); opacity: 0.85;\n  max-width: 620px; margin: 0 auto 28px;\n}\n.contact .contact-cta {\n  display: inline-flex; align-items: center; gap: 12px;\n  padding: 16px 32px;\n  background: var(--def-green); color: var(--def-white);\n  font-family: var(--font-display); font-size: 16px; font-weight: 600;\n  border-radius: 4px;\n  transition: background 200ms ease, gap 200ms ease, transform 200ms ease;\n}\n.contact .contact-cta:hover { background: var(--def-green-600); gap: 16px; transform: translateY(-2px); }\n\n/* ── Footer ──────────────────────────────────────────────────── */\n.foot {\n  border-top: 1px solid var(--def-dark-gray);\n  padding: 20px 40px;\n  font-size: 12px; color: var(--def-cool-gray); opacity: 0.6;\n  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;\n  max-width: 1440px; margin: 0 auto;\n}\n.foot a { color: var(--def-cool-gray); margin-left: 16px; }\n.foot a:hover { color: var(--def-green); }\n\n/* ── Mobile ──────────────────────────────────────────────────── */\n@media (max-width: 1100px) {\n  .topbar nav .topnav-links { display: none; }\n}\n@media (max-width: 980px) {\n  .pipeline.cols-6, .pipeline.cols-5, .pipeline.cols-4 { grid-template-columns: repeat(3, 1fr); }\n  .track, .particles { display: none; }\n  .phase { padding-top: 28px; }\n  .phase .node { top: -10px; }\n  .pipeline { padding-top: 40px; gap: 12px; }\n  .dim-grid { grid-template-columns: repeat(3, 1fr); }\n  .stat-row { grid-template-columns: 1fr; gap: 28px; }\n}\n@media (max-width: 720px) {\n  .topbar { padding: 14px 20px; gap: 12px; }\n  .hero { padding: 40px 20px 16px; }\n  .pipeline-wrap { padding: 24px 20px 16px; }\n  .drawer-wrap { padding: 0 20px; }\n  .drawer-card { padding: 26px 22px 24px; border-radius: 12px; }\n  .drawer-head { grid-template-columns: 1fr; gap: 18px; }\n  .drawer-head .left { gap: 16px; }\n  .drawer-stats { gap: 20px; }\n  .stat-strip { padding: 36px 20px 32px; }\n  .stat-strip-inner { padding: 28px 22px; }\n  .page-thesis { padding: 60px 20px 24px; }\n  .page-thesis-inner { padding-top: 28px; }\n  .hww-bridge { padding: 36px 20px 40px; }\n  .hww-bridge-inner {\n    grid-template-columns: 1fr;\n    gap: 24px; padding: 28px 24px;\n  }\n  .hww-bridge-link { justify-content: center; }\n  .contact { padding: 16px 20px 72px; }\n  .foot { padding: 20px; }\n  .pipeline.cols-6, .pipeline.cols-5, .pipeline.cols-4 { grid-template-columns: 1fr; }\n  .phase .card { min-height: 0; padding-bottom: 56px; }\n  .dim-grid { grid-template-columns: 1fr; }\n  .hero h1 em { white-space: normal; }\n  .topbar nav { gap: 14px; }\n  .topbar nav .cta { padding: 7px 14px; font-size: 13px; }\n}\n\n/* Reduced motion */\n@media (prefers-reduced-motion: reduce) {\n  .track::after, .particle { animation: none !important; }\n  .diff-dot { animation: none !important; }\n  .phase .node { animation: none !important; }\n  * { transition-duration: 0.001ms !important; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<div class=\"bgtex\" aria-hidden=\"true\"><\u002Fdiv>\n<span class=\"ms\" aria-hidden=\"true\" style=\"position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;left:-9999px;\">verified badge groups database crisis_alert format_list_numbered speed menu_book summarize fact_check add expand_more check block arrow_forward arrow_back deployed_code<\u002Fspan>\n\n<!-- ── Top bar ──────────────────────────────────────────────── -->\n<nav class=\"topbar\" aria-label=\"Primary\">\n  <a class=\"brand\" href=\"#assessment\" aria-label=\"Definian — home\">\n    <img src=\"619f52ac-cbcd-4f4b-8a3a-f25a6c63aa7c\" alt=\"Definian\">\n  <\u002Fa>\n  <nav class=\"topnav-links\" aria-label=\"Pages\">\n    <a href=\"#assessment\" id=\"navAssessment\">Assessment<\u002Fa>\n    <a href=\"#how-we-work\" id=\"navHww\">How We Work<\u002Fa>\n    <a class=\"cta\" href=\"#contact\">Start a conversation<\u002Fa>\n  <\u002Fnav>\n<\u002Fnav>\n\n<!-- ============================================================\n     PAGE 1 — Data Modernization Assessment\n     ============================================================ -->\n<div class=\"page-view is-active\" id=\"page-view-edra\">\n\n  <header class=\"hero\">\n    <h1>Your data, ready to modernize.<br><em>Your organization, built to keep it that way.<\u002Fem><\u002Fh1>\n    <p class=\"sub\">Definian's Data Modernization Assessment evaluates both the quality of your data and your organization's ability to sustain trusted data through modernization. Explore each section below.<\u002Fp>\n  <\u002Fheader>\n\n  <section class=\"pipeline-wrap\" aria-label=\"Doctrine\">\n    <div class=\"track\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"particles\" id=\"edraParticles\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"pipeline cols-5\" id=\"edraPipeline\" role=\"tablist\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"drawer-wrap\">\n    <div class=\"drawer\" id=\"edraDrawer\" role=\"tabpanel\" aria-live=\"polite\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page-thesis\" aria-label=\"Closing thesis\">\n    <div class=\"page-thesis-inner\">\n      <span class=\"lede\">Most assessments end at the recommendation.<\u002Fspan>\n      <span class=\"punch\"><em>Ours ends with a plan the organization can run.<\u002Fem><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"stat-strip\" aria-label=\"Outcomes\">\n    <div class=\"stat-strip-inner\">\n      <div class=\"stat-strip-eyebrow\">What the discipline carries<\u002Fdiv>\n      <div class=\"stat-row\">\n        <div>\n          <div class=\"stat-num\"><span class=\"count-up\" data-count=\"15\">0<\u002Fspan>–<span class=\"count-up\" data-count=\"25\">0<\u002Fspan><span class=\"pct\">%<\u002Fspan><\u002Fdiv>\n          <div class=\"stat-lbl\">faster implementation timelines<\u002Fdiv>\n          <div class=\"stat-ctx\">Late data work displaces what go-live actually needs.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"stat-num\"><span class=\"count-up\" data-count=\"30\">0<\u002Fspan><span class=\"pct\">%<\u002Fspan><\u002Fdiv>\n          <div class=\"stat-lbl\">improvement in operational data accuracy<\u002Fdiv>\n          <div class=\"stat-ctx\">Accuracy holds when accountability is operational, not advisory.<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"stat-num\"><span class=\"count-up\" data-count=\"40\">0<\u002Fspan><span class=\"pct\">%<\u002Fspan><\u002Fdiv>\n          <div class=\"stat-lbl\">reduction in realignment meetings on roles and definitions<\u002Fdiv>\n          <div class=\"stat-ctx\">Go-live doesn't create operational discipline. It exposes whether it exists.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"hww-bridge\" aria-label=\"How we work bridge\">\n    <div class=\"hww-bridge-inner\">\n      <div>\n        <div class=\"hww-bridge-eyebrow\">Inside the engagement<\u002Fdiv>\n        <h3>How an assessment actually happens.<\u002Fh3>\n        <p>Four to six weeks, with a deliberate cadence. The team, the methodology, the tooling, the boundaries. Evidentiary, not persuasive.<\u002Fp>\n      <\u002Fdiv>\n      <a class=\"hww-bridge-link\" href=\"#how-we-work\">How We Work <span class=\"arr\" aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"contact\" id=\"contact\">\n    <h3>Talk to us about your modernization.<\u002Fh3>\n    <p>If you're preparing for an ERP, cloud, analytics, or AI modernization — or if a program in flight isn't going the way you expected — we'd be glad to talk through what an assessment would look like for your situation.<\u002Fp>\n    <a class=\"contact-cta\" href=\"mailto:hello@definian.com\">hello@definian.com <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<!-- ============================================================\n     PAGE 2 — How We Work\n     ============================================================ -->\n<div class=\"page-view\" id=\"page-view-hww\">\n\n  <header class=\"hero\">\n    <h1>How a Data Modernization Assessment <em>actually happens.<\u002Fem><\u002Fh1>\n    <p class=\"sub\">The Assessment page answered <em>what<\u002Fem> we evaluate and <em>why<\u002Fem>. This page answers <em>how<\u002Fem>: the engagement, the methodology, the tooling, and the team.<\u002Fp>\n  <\u002Fheader>\n\n  <section class=\"pipeline-wrap\" aria-label=\"Method\">\n    <div class=\"track\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"particles\" id=\"hwwParticles\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"pipeline cols-4\" id=\"hwwPipeline\" role=\"tablist\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"drawer-wrap\">\n    <div class=\"drawer\" id=\"hwwDrawer\" role=\"tabpanel\" aria-live=\"polite\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"contact\">\n    <h3>Ready to see this run for your modernization?<\u002Fh3>\n    <p>We'd be glad to walk you through what a Definian Data Modernization Assessment would look like for your program.<\u002Fp>\n    <a class=\"contact-cta\" href=\"mailto:hello@definian.com\">hello@definian.com <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n  <\u002Fsection>\n\n<\u002Fdiv>\n\n<footer class=\"foot\">\n  <span>© 2026 Definian Data, LLC<\u002Fspan>\n  <div>\n    <a href=\"#\">Privacy<\u002Fa>\n    <a href=\"#\">Terms<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n/* ============================================================\n   V3 — Data + App\n   ============================================================ */\n\nconst DOCTRINE = [\n  {\n    id: 'requires',\n    num: '01',\n    name: 'What Modernization Success Requires',\n    tag: 'Trusted Data. Clear Ownership. Organizational Capability.',\n    isPillars: true,\n    blurbs: [\n      \"Modernizations hold when three things are true at the moment they\\u2019re live. The data is ready for the system that\\u2019s about to receive it. The people responsible for that data know they\\u2019re accountable for it. The organization knows how to operate on the new system\\u2019s terms, not the legacy habits of the old one.\",\n      \"Those three conditions sound straightforward. In practice, they\\u2019re the difference between a modernization that holds and one that has to be quietly re-done over the next several years.\"\n    ],\n    meta: { count: 3, label: 'pillars' },\n    items: [\n      {\n        nm: 'Trusted Data',\n        icon: 'verified',\n        desc: 'Not data that loaded cleanly, but data the business can actually run on.',\n        deep: '<p>Records that reflect operational reality. Standards that hold consistently across regions, functions, and business units. Quality that has owners, not just remediation history.<\u002Fp>'\n      },\n      {\n        nm: 'Clear Ownership',\n        icon: 'badge',\n        desc: 'Stewards who have made stewardship decisions on real data and know how to keep making them.',\n        deep: '<p>Accountability that is operational, not theoretical. Standards that someone is responsible for, by name.<\u002Fp>'\n      },\n      {\n        nm: 'Organizational Capability',\n        icon: 'groups',\n        desc: 'The muscle to operate the new system the way it was designed to be operated.',\n        deep: \"<p>The capability to hold the data the way the target architecture expects it to be held. This is the part that doesn\\u2019t come with the platform. It has to be built, and it has to be built before the system is live, not after.<\u002Fp>\"\n      }\n    ],\n    closing: \"A modernization that delivers all three is a modernization that lasts. A modernization that delivers one or two is a modernization that goes live and then spends the next several years catching up.\",\n    foldout: {\n      label: 'So where do modernizations actually go wrong?',\n      sub: 'It\\u2019s rarely the technology.',\n      prose: [\n        \"Modernizations rarely fail because the technology failed. They fail because the data wasn\\u2019t ready, ownership wasn\\u2019t clear, or the organization never learned to operate the new system on trusted data.\",\n        \"The pattern is consistent. Mappings get built, but the people who understand the business rules aren\\u2019t in the room. Cleansing happens, but no one owns the standards required to keep data clean next quarter. Within ninety days, the same issues resurface \\u2014 because nothing about how the organization handles data actually changed.\"\n      ],\n      callout: \"The modernization was supposed to solve those problems. It didn\\u2019t, because nothing was operationalized to keep them solved.\"\n    }\n  },\n  {\n    id: 'miss',\n    num: '02',\n    name: 'Why Traditional Assessments Miss It',\n    tag: 'Both are reasonable questions. Neither is sufficient on its own.',\n    isContrast: true,\n    contrastLead: \"Most data assessments answer one of two questions \\u2014 and each covers only one half of what modernization actually needs.\",\n    contrast: [\n      {\n        kind: 'Tactical',\n        nm: 'A legacy data quality assessment',\n        q: 'Is the data clean enough?',\n        can: 'Identifies the inconsistencies across your data landscape \\u2014 and how to correct them.',\n        cannot: 'Whether your organization is prepared to sustain that quality.'\n      },\n      {\n        kind: 'Strategic',\n        nm: 'A governance maturity assessment',\n        q: 'Where do we sit against a model?',\n        can: 'Tells you where your organization sits against a maturity model.',\n        cannot: 'Whether the actual data the business depends on today is capable of supporting what you\\u2019re about to ask of it \\u2014 a new system, a reporting overhaul, an insights program, or an AI use case.'\n      }\n    ],\n    prose: [\n      \"Both are reasonable questions. Neither is sufficient on its own.\",\n      \"The gap between those two assessments is where modernizations often fail. Tactical remediation happens without the operational discipline required to sustain it. Or strategic governance work happens in isolation from the real data problems the business is actively struggling with. In both cases, the modernization goes live without changing how the organization actually manages data.\",\n      \"We see this most clearly in recovery engagements: programs already in motion where leadership can sense that something is wrong but can\\u2019t quite name it. Almost without exception, it\\u2019s the same gap \\u2014 one half of the problem was solved without the other. The pattern is consistent enough that we now look for it before it happens.\"\n    ]\n  },\n  {\n    id: 'different',\n    num: '03',\n    name: 'The Definian Difference',\n    tag: 'Most firms assess one or the other. We connect both inside one engagement.',\n    isDifference: true,\n    blurbs: [\n      \"Definian\\u2019s Data Modernization Assessment evaluates both halves of the work in a single engagement: the tactical condition of your data and the organizational capability to sustain trusted data through modernization and beyond.\",\n      \"Most firms assess one or the other. We intentionally connect both.\"\n    ],\n    thesis: '<em>The tactical work<\u002Fem> activates the muscle that builds <em>the strategic discipline.<\u002Fem>',\n    meta: { count: 2, label: 'activations' },\n    diagram: {\n      whole: 'Definian Data Modernization Assessment',\n      halves: [\n        { side: 'data', kind: 'Tactical', nm: 'Data Quality & Readiness', sub: 'What a legacy data quality assessment covers.', icon: 'database' },\n        { side: 'org',  kind: 'Strategic', nm: 'Governance & Operating Model', sub: 'What a governance maturity assessment covers.', icon: 'groups' }\n      ],\n      connector: 'Each activity exposes and operationalizes the other.'\n    },\n    preItems: \"We don\\u2019t separate governance strategy from the real data work happening inside the program. We use each activity to expose and operationalize the other.\",\n    items: [\n      {\n        nm: 'When we profile your data',\n        dir: 'data',\n        desc: 'we uncover the quality issues that will block modernization and force clarity around who owns the standards required to sustain quality afterward.',\n        deep: ''\n      },\n      {\n        nm: 'When we identify governance gaps',\n        dir: 'org',\n        desc: 'we connect them directly to operational problems the business is already experiencing, so remediation becomes actionable, measurable, and urgent.',\n        deep: ''\n      }\n    ],\n    closing: \"This is how governance becomes operational instead of theoretical. Organizations don\\u2019t leave the engagement with a stewardship framework sitting on a wiki page. They leave with stewards who have already made decisions on real data, resolved real issues, and established the behaviors required to sustain trusted data after we\\u2019re gone. The transformation is the moment. The discipline is the outcome.\"\n  },\n  {\n    id: 'evaluate',\n    num: '04',\n    name: 'What We Evaluate',\n    tag: 'Architecture. Quality. Master Data. Process. Governance.',\n    blurbs: [\n      'The dimensions are how we see. Modernization readiness is what we see.'\n    ],\n    meta: { count: 5, label: 'dimensions' },\n    isDimensions: true,\n    dims: [\n      {\n        id: 'architecture', num: '01', nm: 'Data landscape and architecture', short: 'Architecture',\n        blurb: 'We map the systems that hold your data, how they connect, what they depend on, and what that means for your modernization scope.',\n        surfaces: 'Fragmented integrations consistently expose unclear accountability boundaries. When data flows across systems that no one fully owns, governance and operating model gaps become operational rather than theoretical. The architecture diagram becomes a stewardship diagram.',\n        risk: \"Source systems that were never meant to feed a modern target environment usually carry assumptions no one has written down. Those assumptions don\\u2019t show up in design workshops. They show up in cutover.\"\n      },\n      {\n        id: 'quality', num: '02', nm: 'Data quality and fitness', short: 'Quality',\n        blurb: 'We profile your data directly \\u2014 completeness, consistency, duplication, standardization, and fit to the target system\\u2019s requirements.',\n        surfaces: 'Quality issues are the most reliable way to find ownership gaps. When data is wrong and no one is accountable for making it right, the governance and stewardship dimensions get exposed automatically. Profiling forces the question that workshops avoid: <em>who owns this, operationally, today?<\u002Fem>',\n        risk: \"Data that loads cleanly into a target system can still be operationally unfit. The condition that matters isn\\u2019t whether the records pass validation \\u2014 it\\u2019s whether the business can actually run on them after the system is live.\"\n      },\n      {\n        id: 'masterdata', num: '03', nm: 'Master and reference data readiness', short: 'Master Data',\n        blurb: 'We evaluate the condition of the data everything else depends on: customer, supplier, product, finance, hierarchies, cross-references.',\n        surfaces: \"Master data problems are almost always process problems in disguise. Operational variability across regions, business units, or functions creates duplicate reference entities, conflicting hierarchies, and crosswalks that don\\u2019t reconcile. Master data is where business process inconsistency becomes data risk.\",\n        risk: 'Target systems with strong master data models will reject inconsistencies that legacy systems quietly tolerated. The modernization surfaces the inconsistency; the inconsistency was already there.'\n      },\n      {\n        id: 'process', num: '04', nm: 'Business process and operational alignment', short: 'Process',\n        blurb: 'We evaluate where data is produced, where process variability shows up as data risk, and where operational inconsistency breaks the standards data needs to hold.',\n        surfaces: 'Process inconsistency is what makes governance necessary in the first place. When the same business activity is performed differently across regions or functions, no single accountability model can hold \\u2014 and governance becomes the formal answer to a question process variability has already asked.',\n        risk: \"A target system standardizes process by design. Organizations with high pre-modernization variability often discover during user acceptance testing that the new system requires a level of operational consistency they don\\u2019t yet have.\"\n      },\n      {\n        id: 'governance', num: '05', nm: 'Governance and operating model', short: 'Governance',\n        blurb: 'We assess how data decisions get made, who owns what, and whether the operating model can sustain the standards your modernization will require.',\n        surfaces: \"Governance gaps are rarely identified through governance assessments. They\\u2019re identified through quality issues, mapping decisions, and master data conflicts that have no clear owner. By the time we reach this dimension, the gaps are already named \\u2014 we\\u2019re documenting accountability that the tactical work has already exposed.\",\n        risk: \"An operating model that can\\u2019t sustain trusted data through implementation cannot sustain it after. The modernization doesn\\u2019t create the gap; it surfaces a gap that was always there.\"\n      }\n    ],\n    // Primary crossings sit on the spine between adjacent dimensions.\n    // Secondary crossings arc below; revealed when one of their endpoint\n    // dimensions is selected.\n    crossings: {\n      'architecture:quality': {\n        kind: 'primary', title: 'Architecture \\u2192 Quality',\n        paras: [\n          'When we map the source systems and how they interconnect, the quality issues stop being abstract. Fragmented integrations expose where data is being transformed in transit \\u2014 and where the same record has three slightly different shapes depending on which system you ask. The architecture diagram, drawn honestly, predicts the quality findings before profiling confirms them.',\n          '<em>What surfaces:<\u002Fem> a clear picture of which sources will fight the target system, which integration assumptions are undocumented, and which \\u201csingle sources of truth\\u201d are actually composites. Architecture readiness and data quality readiness are not separate questions \\u2014 they are the same question, asked from two angles.'\n        ]\n      },\n      'quality:masterdata': {\n        kind: 'primary', title: 'Quality \\u2192 Master Data',\n        paras: [\n          'Profiling rarely surfaces only quality issues. It surfaces <em>ownership<\u002Fem> issues disguised as quality issues. A duplicate customer record is a quality finding. The reason there are duplicates is a master data finding \\u2014 and usually a process finding underneath that. Quality is the entry point; master data is what\\u2019s actually broken.',\n          '<em>What surfaces:<\u002Fem> which master data domains are quietly fragmented, which reference hierarchies don\\u2019t reconcile across business units, and which records the organization has been working around for years without realizing it. Quality findings become master data conversations the moment you stop treating each duplicate as an isolated defect.'\n        ]\n      },\n      'masterdata:process': {\n        kind: 'primary', title: 'Master Data \\u2192 Process',\n        paras: [\n          'Master data conflicts almost always trace back to operational process variability. When customer onboarding runs differently across regions, you get customer records that don\\u2019t agree. When suppliers are entered through three different intake processes, you get supplier hierarchies that don\\u2019t roll up. Master data is the data layer where business process inconsistency becomes undeniable.',\n          '<em>What surfaces:<\u002Fem> which processes need to standardize before the target system can hold trusted master data, which functions have been operating with informal local variants, and where the cost of process variability will show up when the system goes live. The master data crossing is where governance, process, and master data start to behave as one system.'\n        ]\n      },\n      'process:governance': {\n        kind: 'primary', title: 'Process \\u2192 Governance',\n        paras: [\n          'Once process variability is visible, the governance question becomes operational. Who decides which process is the right one? Who owns the standard when business units have been making their own calls for years? Process inconsistency is what makes governance necessary in the first place \\u2014 and the governance gaps the assessment surfaces are gaps that process variability has been quietly creating, often for a decade.',\n          '<em>What surfaces:<\u002Fem> which decisions the organization has been deferring, which ownership models are formal but not actually operating, and where governance needs to be activated before modernization, not after. By the time the assessment reaches governance, the gaps are already named \\u2014 process variability has named them.'\n        ]\n      },\n      'architecture:masterdata': {\n        kind: 'secondary', title: 'Architecture \\u2192 Master Data',\n        paras: [\n          'System fragmentation produces master data fragmentation. When customer data is mastered in CRM, partially mastered in ERP, and operationally lived-in in three more applications, no single record is canonical. The architecture has been distributing the master data function across systems that were never designed to coordinate.',\n          '<em>What surfaces:<\u002Fem> which master data domains need consolidation before the target system can hold a defensible canonical record, which integrations are doing master data work they were never intended to do, and where architectural choices have created data ownership ambiguity.'\n        ]\n      },\n      'architecture:process': {\n        kind: 'secondary', title: 'Architecture \\u2192 Process',\n        paras: [\n          'System architecture often encodes process assumptions that have outlived their justification. The reason the order management system can\\u2019t talk to the customer system directly is usually a process decision made years ago, not a technical one. Architecture is process history, frozen.',\n          '<em>What surfaces:<\u002Fem> which process changes are actually architecture decisions in disguise, which integration patterns reflect organizational politics rather than operational logic, and where the target system will force process changes that the architecture has been quietly preventing.'\n        ]\n      },\n      'architecture:governance': {\n        kind: 'secondary', title: 'Architecture \\u2192 Governance',\n        paras: [\n          'Fragmented integrations create unclear accountability boundaries between data domains. When customer data flows through six systems on its way to reporting, no single team genuinely owns it \\u2014 they own their slice. The architecture has been quietly distributing accountability for years, and no one has noticed because nothing forced the question.',\n          '<em>What surfaces:<\u002Fem> which data domains will need clearly drawn ownership before modernization, which architecture decisions need governance decisions to accompany them, and where the target system will demand accountability the legacy architecture has been able to avoid.'\n        ]\n      },\n      'quality:process': {\n        kind: 'secondary', title: 'Quality \\u2192 Process',\n        paras: [\n          'Persistent quality issues are usually process signatures. The same data is being entered the same wrong way for the same reason \\u2014 because that\\u2019s how the process actually runs, regardless of what the process documentation says. Profiling reveals the de facto process, which is usually more accurate than the documented one.',\n          '<em>What surfaces:<\u002Fem> where business processes need to be examined before quality remediation makes sense, which \\u201cdata quality issues\\u201d are actually correctly reflecting an inconsistent operational reality, and where cleansing will not stick because the upstream process will keep producing the same defects.'\n        ]\n      },\n      'quality:governance': {\n        kind: 'secondary', title: 'Quality \\u2192 Governance',\n        paras: [\n          'Quality findings are the most reliable way to find ownership gaps. When a quality issue is identified and the conversation about who fixes it has no clear answer, the governance gap has been named \\u2014 not by a governance assessment but by an operational finding. The data is the witness; governance is the documentation.',\n          '<em>What surfaces:<\u002Fem> which standards need owners assigned before modernization, where existing accountability models have been failing without anyone tracking it, and how the assessment\\u2019s quality findings translate directly into governance activation work.'\n        ]\n      },\n      'masterdata:governance': {\n        kind: 'secondary', title: 'Master Data \\u2192 Governance',\n        paras: [\n          'Master data is where governance either holds or fails. Customer, supplier, product, finance \\u2014 these are the domains where ownership decisions get made every day, whether anyone has formalized them or not. Master data conflicts are governance conflicts that have lost their meeting.',\n          '<em>What surfaces:<\u002Fem> which master data domains need formal stewardship before modernization, which informal stewards have been operating without authority or backup, and where the current governance model breaks down at the master data layer.'\n        ]\n      }\n    }\n  },\n  {\n    id: 'get',\n    num: '05',\n    name: 'What You Get',\n    tag: 'Most assessments end at the recommendation.
