Ours ends with a plan the organization can run.',\n    isDashboard: true,\n    blurbs: [\n      'The assessment delivers a clear picture of where you stand, what to fix, who fixes it, and how the discipline holds afterward.'\n    ],\n    meta: { count: 7, label: 'deliverables' },\n    items: [\n      { nm: 'Executive Findings Summary', icon: 'summarize', desc: 'The assessment translated into business-level risks, priorities, and decisions for leadership.', deep: '' },\n      { nm: 'Current State Assessment', icon: 'fact_check', desc: 'Your data, your governance, your stewards, and your operational maturity, assessed against what the modernization actually needs.', deep: '' },\n      { nm: 'Data Quality & Readiness Findings', icon: 'database', desc: \"Direct profiling of every in-scope source against the target system\\u2019s requirements. Scope is focused on the master data domains your modernization depends on most.\", deep: '' },\n      { nm: 'Modernization Risk Analysis', icon: 'crisis_alert', desc: 'The specific risks that could impact your ERP, cloud, analytics, AI, or master data initiatives, with the underlying data conditions that drive each risk.', deep: '' },\n      { nm: 'Prioritized Recommendations', icon: 'format_list_numbered', desc: 'Sequenced against your modernization timeline, with the operational dependencies between them made explicit.', deep: '' },\n      { nm: 'Data Readiness Scorecard', icon: 'speed', desc: 'A defensible view of readiness across every dimension of the assessment. The artifact leadership uses to make go/no-go calls.', deep: '' },\n      { nm: 'Modernization Implementation Playbook', icon: 'menu_book', feature: true, desc: 'Not a roadmap. A playbook: who owns what, against which modernization milestones, and how the discipline gets sustained after the assessment ends.', deep: '' }\n    ]\n  }\n];\n\nconst METHOD = [\n  {\n    id: 'engagement',\n    num: '01',\n    name: 'The Engagement',\n    tag: 'Four to six weeks. Structured to expose risk early and operationalize readiness fast.',\n    blurbs: [\n      'The structure below reflects a typical engagement. Scale varies based on modernization surface area, system count, and organizational complexity. Larger programs run longer. Smaller, focused engagements run shorter. The cadence holds because the work it does is the same.'\n    ],\n    items: [\n      {\n        nm: 'Week 1 \\u2014 Orientation and access',\n        desc: 'Foundation work: access, inventory, stakeholders, scope.',\n        deep: '<p>The first week establishes the operational foundation. Data access is set up across in-scope systems, stakeholders are identified across data, governance, and business functions, and scope is confirmed against the SOW.<\u002Fp><p><em>Artifacts:<\u002Fem> confirmed scope \\u00b7 access plan \\u00b7 stakeholder map \\u00b7 profiling inventory<\u002Fp>'\n      },\n      {\n        nm: 'Weeks 2\\u20133 \\u2014 Profiling and analysis',\n        desc: 'Concurrent profiling and stewardship work, anchored to early findings.',\n        deep: '<p>Tactical profiling runs alongside governance, stewardship, and process discussions. Findings begin surfacing within days of access being established. Data conditions and organizational behaviors are analyzed together in real time.<\u002Fp><p><em>Artifacts:<\u002Fem> initial profile findings \\u00b7 operational observations \\u00b7 governance working notes<\u002Fp>'\n      },\n      {\n        nm: 'Weeks 3\\u20134 \\u2014 Synthesis and findings',\n        desc: 'Observation to interpretation. The dimensional view takes shape.',\n        deep: '<p>Findings are validated and connected across dimensions. A quality issue may also expose an ownership gap. A master data conflict may reveal a process inconsistency. The Playbook begins taking operational shape.<\u002Fp><p><em>Artifacts:<\u002Fem> validated findings \\u00b7 operational dependencies \\u00b7 recommendation sequencing<\u002Fp>'\n      },\n      {\n        nm: 'Weeks 5\\u20136 \\u2014 Recommendations and playbook',\n        desc: 'The Playbook is finalized. Closing readout to leadership.',\n        deep: '<p>The final phase produces the deliverable set. The Executive Findings Summary takes shape. The Data Readiness Scorecard gets populated. The Modernization Implementation Playbook is finalized: who owns what, against which modernization milestones, and how the discipline gets sustained after the assessment ends.<\u002Fp><p><em>Artifacts:<\u002Fem> deliverable set \\u00b7 modernization playbook \\u00b7 prioritized recommendations<\u002Fp>'\n      }\n    ],\n    closing: 'The assessment is time-bound. The operational discipline is not. The engagement concludes with the handoff of the Modernization Implementation Playbook, built to be executed by the client team after the assessment ends. By that point, the organization has already done the difficult work. Stewardship decisions have been made. Standards have been defined. Ownership has been accepted. The Playbook formalizes what the organization has already begun. Some clients ask us to help execute the Playbook. Some ask us to support specific governance or remediation workstreams. Some run the Playbook entirely on their own. All three are common. None are required. The goal is not consultant dependency. The goal is an organization capable of sustaining trusted data long after the modernization goes live.'\n  },\n  {\n    id: 'methodology',\n    num: '02',\n    name: 'The Methodology',\n    tag: 'The analytical discipline that turns profiling output into the dimensional view.',\n    blurbs: [\n      'Four practitioner-level threads run through the work: how we profile, how we interpret, how we synthesize, how we validate. Together they are the operational mechanics behind the activation pattern.'\n    ],\n    items: [\n      {\n        nm: 'The Profiling Approach',\n        desc: 'Profiling at scale is fundamentally different from profiling by sampling.',\n        deep: '<p>We profile every in-scope source system end-to-end: every column, every value, every pattern, every relationship. The highest-impact data issues are rarely the most frequent ones. Sampling catches the broad patterns and misses the corner cases that tend to fail at cutover.<\u002Fp><p>Findings surface in three waves. Wave one catches the high-volume issues, typically within days. Wave two reveals operational patterns: process variability, inconsistent stewardship, and master data fragmentation. Wave three catches the corner cases: the issues that won\\u2019t show up in sampling but will absolutely show up at cutover.<\u002Fp><p>Pattern detection within Applaud uses machine learning models trained on the profiling work of prior engagements. The models surface duplicate candidates, format anomalies, and master data fragmentation signatures that human reviewers would catch eventually. They just wouldn\\u2019t catch them in four weeks.<\u002Fp><p><em>The AI accelerates detection. Interpretation remains practitioner-led.<\u002Fem><\u002Fp>'\n      },\n      {\n        nm: 'The Analytical Lens',\n        desc: 'Profiling produces data. Interpretation makes it actionable.',\n        deep: \"<p>When a profiling finding lands, the analytical question is rarely <em>\\u2018is this a quality issue?\\u2019<\u002Fem><\u002Fp><p>The more important question is: <em>\\u2018what does this reveal about ownership, process, master data, architecture, and governance?\\u2019<\u002Fem><\u002Fp><p><strong>The interpretive pattern:<\u002Fstrong><\u002Fp><div class=\\\"lens-matrix\\\"><div class=\\\"lens-pattern\\\"><div class=\\\"lp-finding\\\">A quality finding<\u002Fdiv><div class=\\\"lp-signal\\\">usually signals an <span class=\\\"lp-arrow\\\">\\u2192<\u002Fspan> <span class=\\\"lp-target\\\">ownership gap<\u002Fspan><\u002Fdiv><p class=\\\"lp-question\\\">Who is accountable for this being right?<\u002Fp><\u002Fdiv><div class=\\\"lens-pattern\\\"><div class=\\\"lp-finding\\\">A master data conflict<\u002Fdiv><div class=\\\"lp-signal\\\">usually signals <span class=\\\"lp-arrow\\\">\\u2192<\u002Fspan> <span class=\\\"lp-target\\\">process variability<\u002Fspan><\u002Fdiv><p class=\\\"lp-question\\\">Who runs the process that produced this?<\u002Fp><\u002Fdiv><div class=\\\"lens-pattern\\\"><div class=\\\"lp-finding\\\">Master data fragmentation<\u002Fdiv><div class=\\\"lp-signal\\\">usually signals <span class=\\\"lp-arrow\\\">\\u2192<\u002Fspan> <span class=\\\"lp-target\\\">architecture distribution<\u002Fspan><\u002Fdiv><p class=\\\"lp-question\\\">Which system was supposed to be canonical?<\u002Fp><\u002Fdiv><div class=\\\"lens-pattern\\\"><div class=\\\"lp-finding\\\">Persistent quality issues<\u002Fdiv><div class=\\\"lp-signal\\\">usually signal a <span class=\\\"lp-arrow\\\">\\u2192<\u002Fspan> <span class=\\\"lp-target\\\">governance gap<\u002Fspan><\u002Fdiv><p class=\\\"lp-question\\\">What standard isn\\u2019t being held?<\u002Fp><\u002Fdiv><\u002Fdiv><p>This interpretive discipline is what makes the assessment a modernization readiness assessment rather than a data quality audit.<\u002Fp>\"\n      },\n      {\n        nm: 'The Synthesis Discipline',\n        desc: \"The Modernization Implementation Playbook is not a recommendation summary. It is the synthesis of the assessment\\u2019s findings into an executable plan.\",\n        deep: '<p>The synthesis discipline addresses four questions for every significant finding:<\u002Fp><p><em>What needs to happen.<\u002Fem> The remediation, decision, activation, or standardization activity the finding requires.<br><em>In what order.<\u002Fem> Sequencing aligned to modernization milestones and operational dependencies.<br><em>Who owns it.<\u002Fem> Named accountability. Never \\u201cthe business\\u201d or \\u201cthe data team.\\u201d<br><em>How does it activate the discipline.<\u002Fem> The lasting capability the organization gains beyond resolving the immediate issue.<\u002Fp>'\n      },\n      {\n        nm: 'The Validation Cadence',\n        desc: 'Findings are validated collaboratively before they become recommendations. Validation is not simple confirmation. It is structured pressure-testing.',\n        deep: \"<p>We present findings as interpretations. Stakeholders confirm, refute, or contextualize them. Where the interpretation holds, the finding moves toward recommendation. Where it needs context, the finding gets revised. Where it is wrong, the finding gets discarded.<\u002Fp><p>By the final readout, the recommendations are not surprises. They are a record of conversations the client has already worked through during the engagement.<\u002Fp>\"\n      }\n    ]\n  },\n  {\n    id: 'tooling',\n    num: '03',\n    name: 'The Tooling',\n    tag: \"Applaud accelerates the methodology. It doesn\\u2019t replace it.\",\n    blurbs: [\n      \"Applaud is Definian\\u2019s data assessment platform. In the context of an Data Modernization Assessment, it does four things.\"\n    ],\n    thesis: 'Applaud <em>predicts load failures<\u002Fem> before load.',\n    thesisBody: 'Applaud carries a library of pre-validation patterns built from prior modernization and conversion engagements: sequencing conflicts, relationship breaks, master data duplication, configuration mismatches. The kinds of issues that traditionally surface at load time, when they cost the most to fix. Applaud surfaces them in the assessment instead.',\n    items: [\n      {\n        nm: 'Profiles data at scale',\n        desc: 'Connects via ODBC. Ingests delimited and Excel-based sources. Produces complete profiles across every in-scope source: column-level statistics, pattern analyses, cross-column relationships. Scale removes sampling tradeoffs.',\n        deep: ''\n      },\n      {\n        nm: 'Surfaces patterns',\n        desc: \"Pattern analysis identifies distinct formats present in each field, frequencies, and outliers. This is how corner-case issues get surfaced early. They\\u2019re the ones that would otherwise not appear until cutover.\",\n        deep: ''\n      },\n      {\n        nm: 'Automates validation',\n        desc: 'Once mapping logic is defined, Applaud validates transformed data against target system requirements in repeatable cycles. Iteration remains fast. Validation remains consistent. Defect tracking remains reliable.',\n        deep: ''\n      },\n      {\n        nm: 'Accelerates findings',\n        desc: 'Reports that would take weeks of manual SQL work surface within days. This is what makes the four-to-six-week assessment timeline possible. The team spends its time on interpretation and synthesis, not on extraction and counting.',\n        deep: ''\n      }\n    ],\n    closing: \"The methodology is what produces the assessment\\u2019s value. Applaud is what makes the methodology executable in six weeks instead of six months. The methodology is platform-flexible. Where other tooling substantively contributes, it appears alongside.\"\n  },\n  {\n    id: 'engmodel',\n    num: '04',\n    name: 'The Engagement Model',\n    tag: 'The team that delivers, the posture of the engagement, the boundaries.',\n    blurbs: [\n      \"A typical assessment engages four roles. Smaller engagements may combine them. Larger engagements may add analysts. The structure scales; the work doesn\\u2019t change.\"\n    ],\n    items: [\n      {\n        nm: 'Assessment Lead',\n        desc: 'Senior practitioner accountable for the engagement. Owns scope, deliverables, and the working relationship with client leadership. Signs off on findings and recommendations.',\n        deep: ''\n      },\n      {\n        nm: 'Data Analysts',\n        desc: 'Run the profiling work, surface patterns, validate findings. Depth of analyst engagement scales with the data complexity of the source systems.',\n        deep: ''\n      },\n      {\n        nm: 'Governance & Stewardship Advisor',\n        desc: 'Runs the governance, process, and operating model sessions. Anchors organizational findings to data findings in real time. Most stakeholder-facing role on the team.',\n        deep: ''\n      },\n      {\n        nm: 'Modernization Strategist',\n        desc: 'Synthesizes findings into the Modernization Implementation Playbook. Connects the assessment to the broader modernization context. Owns sequencing and dependency mapping.',\n        deep: ''\n      }\n    ],\n    closing: \"The assessment is collaborative, not extractive. We work alongside the client\\u2019s data, governance, IT, and business stakeholders throughout. We ask for access to in-scope source systems, identified stakeholders for governance, process, and stewardship conversations, availability for working sessions (typically 2\\u20134 hours per week per key stakeholder), and willingness to engage with findings as they emerge. The collaborative working pattern is what makes the discipline-activation work. Client stakeholders are not passive recipients of findings; they participate in the interpretation. By the end of the engagement, the stewards have already made stewardship decisions, the standards have been articulated, and the operating model has been pressure-tested. The Playbook captures what the organization has already started doing.\",\n    scopePanel: {\n      includes: [\n        'Profiling and analysis of in-scope source systems',\n        'Working sessions on governance, process, and operating model',\n        'Synthesis of findings against the five dimensions',\n        'Production of the complete deliverable set',\n        'Closing readout and Playbook handoff'\n      ],\n      excludes: [\n        'Execution of the Playbook',\n        'Data remediation work',\n        'Implementation of the target system',\n        'Ongoing data quality monitoring or governance operation',\n        'Tool implementation beyond the assessment window'\n      ]\n    }\n  }\n];\n\n/* ============================================================\n   App\n   ============================================================ */\n\nconst pageState = { edra: { open: null, openItem: null }, hww: { open: null, openItem: null } };\n\nfunction renderPipeline(pageId, phases, pipelineEl) {\n  pipelineEl.innerHTML = '';\n  phases.forEach((p, i) => {\n    const tile = document.createElement('button');\n    tile.className = 'phase';\n    tile.type = 'button';\n    tile.dataset.id = p.id;\n    tile.setAttribute('role', 'tab');\n    tile.setAttribute('aria-pressed', 'false');\n    tile.style.padding = '0';\n    tile.style.background = 'transparent';\n    tile.style.cursor = 'pointer';\n    tile.style.textAlign = 'left';\n    tile.innerHTML = `\n      <div class=\"node\" aria-hidden=\"true\"><\u002Fdiv>\n      <div class=\"card\">\n        <div class=\"num\">${p.num}<\u002Fdiv>\n        <div class=\"name\">${p.name}<\u002Fdiv>\n        <div class=\"meta\">\n          ${p.meta ? `<span class=\"count\"><b>${p.meta.count}<\u002Fb> ${p.meta.label}<\u002Fspan>` : '<span class=\"count\"><\u002Fspan>'}\n          <span class=\"open-cue\">Open<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n    tile.addEventListener('click', () => togglePhase(pageId, phases, p.id));\n    pipelineEl.appendChild(tile);\n  });\n}\n\nfunction renderDrawer(pageId, phases, phaseId) {\n  const p = phases.find(x => x.id === phaseId);\n  if (!p) return '';\n  if (p.isDimensions) return renderDimensionsDrawer(p);\n  if (p.isPillars)    return renderPillarsDrawer(p);\n  if (p.isContrast)   return renderContrastDrawer(p);\n  if (p.isDifference) return renderDifferenceDrawer(p);\n  if (p.isDashboard)  return renderDashboardDrawer(p);\n\n  // Multi-paragraph blurb (V1's intro paragraphs, verbatim).\n  const blurbsHtml = (p.blurbs || []).map(b => `<p>${b}<\u002Fp>`).join('');\n  // Flowing prose for sections that V1 wrote as paragraphs (no structured items).\n  const proseHtml = p.prose\n    ? `<div class=\"drawer-prose\">${p.prose.map(para => `<p>${para}<\u002Fp>`).join('')}<\u002Fdiv>` : '';\n  // V1's emphasized callout line (e.g., section 2 \"The transformation was supposed to solve those problems.\").\n  const calloutHtml = p.callout\n    ? `<div class=\"drawer-callout\">${p.callout}<\u002Fdiv>` : '';\n  // V1's preserved thesis blockquote (section 4 doctrine, tooling page).\n  const thesisHtml = p.thesis ? `<div class=\"drawer-thesis\">${p.thesis}<\u002Fdiv>` : '';\n  const thesisBodyHtml = p.thesisBody\n    ? `<div class=\"drawer-thesis-body\"><p>${p.thesisBody}<\u002Fp><\u002Fdiv>` : '';\n  const preItemsHtml = p.preItems\n    ? `<div class=\"drawer-pre\"><p>${p.preItems}<\u002Fp><\u002Fdiv>` : '';\n  const closingHtml = p.closing\n    ? `<div class=\"drawer-closing\"><p>${p.closing}<\u002Fp><\u002Fdiv>` : '';\n\n  // Activity cards. If an item has no deep content, render it as a static\n  // row (no chevron, no click-to-expand) so it doesn't promise interaction\n  // that has nothing behind it.\n  const itemsHtml = p.items ? p.items.map((it, idx) => {\n    const hasDeep = !!(it.deep && it.deep.trim());\n    const chevron = hasDeep\n      ? '<span class=\"chevron\" aria-hidden=\"true\"><svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"9 18 15 12 9 6\"><\u002Fpolyline><\u002Fsvg><\u002Fspan>'\n      : '';\n    const role = hasDeep ? 'button' : 'group';\n    const tabAttr = hasDeep ? 'tabindex=\"0\"' : '';\n    const moreBlock = hasDeep\n      ? `<div class=\"more\"><div class=\"inner\"><div class=\"deep\">${it.deep}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`\n      : '';\n    return `\n      <div class=\"act${hasDeep ? '' : ' no-expand'}\" data-idx=\"${idx}\" role=\"${role}\" ${tabAttr} aria-expanded=\"false\">\n        <div class=\"row1\">\n          <div class=\"nm\">${it.nm}<\u002Fdiv>\n          ${chevron}\n        <\u002Fdiv>\n        <div class=\"desc\">${it.desc}<\u002Fdiv>\n        ${moreBlock}\n      <\u002Fdiv>\n    `;\n  }).join('') : '';\n\n  // Scope panel (Method §04: what's in / what's out).\n  const scopeHtml = p.scopePanel\n    ? `\n      <div class=\"scope-panel\">\n        <div class=\"scope-col includes\">\n          <div class=\"scope-label\">What an assessment includes<\u002Fdiv>\n          <ul>${p.scopePanel.includes.map(s => `<li>${s}<\u002Fli>`).join('')}<\u002Ful>\n        <\u002Fdiv>\n        <div class=\"scope-col excludes\">\n          <div class=\"scope-label\">What it does not include<\u002Fdiv>\n          <ul>${p.scopePanel.excludes.map(s => `<li>${s}<\u002Fli>`).join('')}<\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `\n    : '';\n\n  return `\n    <div class=\"drawer-card\">\n      <div class=\"drawer-head\">\n        <div class=\"left\">\n          <div class=\"num2\">${p.num}<\u002Fdiv>\n          <div class=\"name2\">${p.name}<\u002Fdiv>\n          ${blurbsHtml ? `<div class=\"blurb2\">${blurbsHtml}<\u002Fdiv>` : ''}\n        <\u002Fdiv>\n        <button class=\"closebtn\" type=\"button\" aria-label=\"Close\" data-action=\"close\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      ${proseHtml}\n      ${calloutHtml}\n      ${preItemsHtml}\n      ${thesisHtml}\n      ${thesisBodyHtml}\n      ${itemsHtml ? `<div class=\"activities\">${itemsHtml}<\u002Fdiv>` : ''}\n      ${closingHtml}\n      ${scopeHtml}\n    <\u002Fdiv>\n  `;\n}\n\nfunction drawerHead(p) {\n  const blurbsHtml = (p.blurbs || []).map(b => `<p>${b}<\u002Fp>`).join('');\n  return `\n    <div class=\"drawer-head\">\n      <div class=\"left\">\n        <div class=\"num2\">${p.num}<\u002Fdiv>\n        <div class=\"name2\">${p.name}<\u002Fdiv>\n        ${blurbsHtml ? `<div class=\"blurb2\">${blurbsHtml}<\u002Fdiv>` : ''}\n      <\u002Fdiv>\n      <button class=\"closebtn\" type=\"button\" aria-label=\"Close\" data-action=\"close\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n    <\u002Fdiv>`;\n}\n\n/* §01 — Three Pillars infographic + folded \"where it goes wrong\" reveal. */\nfunction renderPillarsDrawer(p) {\n  const pillars = p.items.map((it, idx) => `\n    <div class=\"pillar\" data-idx=\"${idx}\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\">\n      <div class=\"pillar-top\">\n        <span class=\"pillar-icon\"><span class=\"ms\" aria-hidden=\"true\">${it.icon}<\u002Fspan><\u002Fspan>\n        <span class=\"pillar-cue ms\" aria-hidden=\"true\">add<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"pillar-name\">${it.nm}<\u002Fdiv>\n      <div class=\"pillar-body\"><div class=\"pillar-body-inner\">\n        <p class=\"pillar-desc\">${it.desc}<\u002Fp>\n        <div class=\"pillar-deep\">${it.deep}<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n\n  const fold = p.foldout ? `\n    <div class=\"foldout\">\n      <button class=\"foldout-bar\" type=\"button\" aria-expanded=\"false\" data-action=\"foldout\">\n        <span class=\"foldout-text\">\n          <span class=\"foldout-q\">${p.foldout.label}<\u002Fspan>\n          <span class=\"foldout-sub\">${p.foldout.sub}<\u002Fspan>\n        <\u002Fspan>\n        <span class=\"foldout-chevron ms\" aria-hidden=\"true\">expand_more<\u002Fspan>\n      <\u002Fbutton>\n      <div class=\"foldout-body\"><div class=\"foldout-body-inner\">\n        <div class=\"foldout-prose\">${p.foldout.prose.map(x => `<p>${x}<\u002Fp>`).join('')}<\u002Fdiv>\n        <div class=\"drawer-callout foldout-callout\">${p.foldout.callout}<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>` : '';\n\n  return `\n    <div class=\"drawer-card\">\n      ${drawerHead(p)}\n      <div class=\"pillars\" role=\"group\" aria-label=\"The three conditions\">${pillars}<\u002Fdiv>\n      ${p.closing ? `<div class=\"drawer-closing\"><p>${p.closing}<\u002Fp><\u002Fdiv>` : ''}\n      ${fold}\n    <\u002Fdiv>`;\n}\n\n/* §02 — Two-card contrast: each traditional assessment covers one half. */\nfunction renderContrastDrawer(p) {\n  const card = c => `\n    <div class=\"contrast-card ${c.kind.toLowerCase()}\">\n      <div class=\"cc-kind\">${c.kind} half<\u002Fdiv>\n      <div class=\"cc-name\">${c.nm}<\u002Fdiv>\n      <div class=\"cc-q\">${c.q}<\u002Fdiv>\n      <div class=\"cc-rows\">\n        <div class=\"cc-row can\">\n          <span class=\"cc-row-label\"><span class=\"ms\" aria-hidden=\"true\">check<\u002Fspan> Can tell you<\u002Fspan>\n          <span class=\"cc-row-text\">${c.can}<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"cc-row cannot\">\n          <span class=\"cc-row-label\"><span class=\"ms\" aria-hidden=\"true\">block<\u002Fspan> Cannot tell you<\u002Fspan>\n          <span class=\"cc-row-text\">${c.cannot}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  return `\n    <div class=\"drawer-card\">\n      ${drawerHead(p)}\n      ${p.contrastLead ? `<div class=\"drawer-pre\"><p>${p.contrastLead}<\u002Fp><\u002Fdiv>` : ''}\n      <div class=\"contrast-grid\">\n        ${card(p.contrast[0])}\n        <div class=\"contrast-vs\" aria-hidden=\"true\"><span>vs<\u002Fspan><\u002Fdiv>\n        ${card(p.contrast[1])}\n      <\u002Fdiv>\n      <div class=\"drawer-prose\">${p.prose.map(x => `<p>${x}<\u002Fp>`).join('')}<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n/* §03 — The Definian Difference: both assessments living inside ours. */\nfunction renderDifferenceDrawer(p) {\n  const d = p.diagram;\n  const half = h => `\n    <div class=\"diff-half ${h.side}\" data-half=\"${h.side}\">\n      <span class=\"diff-half-icon\"><span class=\"ms\" aria-hidden=\"true\">${h.icon}<\u002Fspan><\u002Fspan>\n      <span class=\"diff-half-kind\">${h.kind}<\u002Fspan>\n      <span class=\"diff-half-nm\">${h.nm}<\u002Fspan>\n      <span class=\"diff-half-sub\">${h.sub}<\u002Fspan>\n    <\u002Fdiv>`;\n  const acts = p.items.map((it, idx) => `\n    <button class=\"diff-act\" data-dir=\"${it.dir}\" data-idx=\"${idx}\" type=\"button\" aria-pressed=\"false\">\n      <span class=\"diff-act-num\">0${idx + 1}<\u002Fspan>\n      <span class=\"diff-act-text\"><b>${it.nm}<\u002Fb> ${it.desc}<\u002Fspan>\n      <span class=\"diff-act-flow\">${it.dir === 'data' ? 'Data \\u2192 Organization' : 'Organization \\u2192 Data'}<\u002Fspan>\n    <\u002Fbutton>`).join('');\n  return `\n    <div class=\"drawer-card\">\n      ${drawerHead(p)}\n      <div class=\"diff\" id=\"diffViz\">\n        <div class=\"diff-frame\">\n          <div class=\"diff-frame-tag\"><span class=\"ms\" aria-hidden=\"true\">deployed_code<\u002Fspan> ${d.whole}<\u002Fdiv>\n          <div class=\"diff-venn\">\n            ${half(d.halves[0])}\n            <div class=\"diff-link\" aria-hidden=\"true\">\n              <span class=\"diff-link-line\"><\u002Fspan>\n              <span class=\"diff-arrow fwd ms\">arrow_forward<\u002Fspan>\n              <span class=\"diff-arrow back ms\">arrow_back<\u002Fspan>\n              <span class=\"diff-dot\"><\u002Fspan>\n            <\u002Fdiv>\n            ${half(d.halves[1])}\n          <\u002Fdiv>\n          <div class=\"diff-connector\">${d.connector}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"diff-activations\">${acts}<\u002Fdiv>\n        <div class=\"diff-thesis\">${p.thesis}<\u002Fdiv>\n      <\u002Fdiv>\n      ${p.closing ? `<div class=\"drawer-closing\"><p>${p.closing}<\u002Fp><\u002Fdiv>` : ''}\n    <\u002Fdiv>`;\n}\n\n/* §05 — Deliverables dashboard: icon per artifact, detail on hover/click. */\nfunction renderDashboardDrawer(p) {\n  const tiles = p.items.map((it, idx) => `\n    <div class=\"dtile${it.feature ? ' is-feature' : ''}\" data-idx=\"${idx}\" role=\"button\" tabindex=\"0\" aria-expanded=\"false\">\n      <div class=\"dtile-top\">\n        <span class=\"dtile-icon\"><span class=\"ms\" aria-hidden=\"true\">${it.icon}<\u002Fspan><\u002Fspan>\n        ${it.feature ? '<span class=\"dtile-badge\">The outcome<\u002Fspan>' : ''}\n        <span class=\"dtile-cue ms\" aria-hidden=\"true\">add<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"dtile-name\">${it.nm}<\u002Fdiv>\n      <div class=\"dtile-body\"><div class=\"dtile-body-inner\"><p>${it.desc}<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`).join('');\n  return `\n    <div class=\"drawer-card\">\n      ${drawerHead(p)}\n      <div class=\"dashboard\">${tiles}<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\nfunction renderDimensionsDrawer(p) {\n  const blurbsHtml = (p.blurbs || []).map(b => `<p>${b}<\u002Fp>`).join('');\n  // Build the spine: 5 dimensions interleaved with 4 primary crossings.\n  const items = [];\n  p.dims.forEach((d, i) => {\n    items.push(`\n      <button class=\"cx-dim\" data-dim=\"${d.id}\" type=\"button\" aria-pressed=\"false\">\n        <span class=\"cx-dim-num\">${d.num}<\u002Fspan>\n        <span class=\"cx-dim-dot\" aria-hidden=\"true\"><\u002Fspan>\n        <span class=\"cx-dim-name\">${d.short}<\u002Fspan>\n      <\u002Fbutton>\n    `);\n    if (i < p.dims.length - 1) {\n      const next = p.dims[i + 1];\n      const key = d.id + ':' + next.id;\n      items.push(`\n        <button class=\"cx-prim\" data-cross=\"${key}\" type=\"button\" aria-pressed=\"false\">\n          <span class=\"cx-prim-arrow\" aria-hidden=\"true\"><\u002Fspan>\n          <span class=\"cx-prim-label\">${d.short.slice(0,1)} \\u2192 ${next.short.slice(0,1)}<\u002Fspan>\n        <\u002Fbutton>\n      `);\n    }\n  });\n  return `\n    <div class=\"drawer-card\">\n      <div class=\"drawer-head\">\n        <div class=\"left\">\n          <div class=\"num2\">${p.num}<\u002Fdiv>\n          <div class=\"name2\">${p.name}<\u002Fdiv>\n          ${blurbsHtml ? `<div class=\"blurb2\">${blurbsHtml}<\u002Fdiv>` : ''}\n        <\u002Fdiv>\n        <button class=\"closebtn\" type=\"button\" aria-label=\"Close\" data-action=\"close\"><svg viewBox=\"0 0 24 24\" width=\"18\" height=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"6\" y1=\"6\" x2=\"18\" y2=\"18\"><\u002Fline><line x1=\"18\" y1=\"6\" x2=\"6\" y2=\"18\"><\u002Fline><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"dim-spine-wrap\">\n        <div class=\"dim-spine\" id=\"dimSpine\">\n          <div class=\"cx-baseline\" aria-hidden=\"true\"><\u002Fdiv>\n          <svg class=\"cx-arcs\" id=\"cxArcs\" aria-hidden=\"true\"><\u002Fsvg>\n          <div class=\"cx-row\">${items.join('')}<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cx-arc-hint\" id=\"cxArcHint\">Select a dimension to reveal its longer-range crossings.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"dim-detail\" id=\"dimDetail\"><\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\n\nfunction renderDimensionDetail(p, key) {\n  const detail = document.getElementById('dimDetail');\n  if (!detail) return;\n\n  // key can be a dim id or a crossing key (e.g., 'architecture:quality')\n  if (!key) {\n    detail.innerHTML = '<p class=\"dim-empty\">Select a dimension to read what it evaluates. Select a crossing to read what surfaces where two dimensions meet.<\u002Fp>';\n    return;\n  }\n  if (key.indexOf(':') !== -1) {\n    const c = (p.crossings || {})[key];\n    if (!c) return;\n    const kindLabel = c.kind === 'primary' ? 'Primary crossing' : 'Longer-range crossing';\n    detail.innerHTML =\n      `<div class=\"dim-kind\">${kindLabel}<\u002Fdiv>` +\n      `<h4 class=\"dim-title\">${c.title}<\u002Fh4>` +\n      `<div class=\"dim-body\">${c.paras.map(x => `<p>${x}<\u002Fp>`).join('')}<\u002Fdiv>`;\n  } else {\n    const d = p.dims.find(x => x.id === key);\n    if (!d) return;\n    detail.innerHTML =\n      `<div class=\"dim-kind\">${d.num} \\u00b7 Dimension<\u002Fdiv>` +\n      `<h4 class=\"dim-title\">${d.nm}<\u002Fh4>` +\n      `<div class=\"dim-body\"><p>${d.blurb}<\u002Fp>` +\n        `<div class=\"dd\"><div class=\"dd-label\">What surfaces<\u002Fdiv><div class=\"dd-text\">${d.surfaces}<\u002Fdiv><\u002Fdiv>` +\n        `<div class=\"dd\"><div class=\"dd-label\">Where risk lives<\u002Fdiv><div class=\"dd-text\">${d.risk}<\u002Fdiv><\u002Fdiv>` +\n      `<\u002Fdiv>`;\n  }\n}\n\nfunction togglePhase(pageId, phases, phaseId) {\n  const state = pageState[pageId];\n  const drawer = document.getElementById(pageId === 'edra' ? 'edraDrawer' : 'hwwDrawer');\n  const pipeline = document.getElementById(pageId === 'edra' ? 'edraPipeline' : 'hwwPipeline');\n\n  if (state.open === phaseId) {\n    // Close\n    state.open = null;\n    state.openItem = null;\n    drawer.classList.remove('is-open');\n    pipeline.querySelectorAll('.phase').forEach(t => {\n      t.classList.remove('is-open');\n      t.setAttribute('aria-pressed', 'false');\n    });\n    setTimeout(() => { drawer.innerHTML = ''; }, 500);\n    return;\n  }\n\n  state.open = phaseId;\n  state.openItem = null;\n  pipeline.querySelectorAll('.phase').forEach(t => {\n    const on = t.dataset.id === phaseId;\n    t.classList.toggle('is-open', on);\n    t.setAttribute('aria-pressed', on ? 'true' : 'false');\n  });\n  drawer.innerHTML = renderDrawer(pageId, phases, phaseId);\n  // Force reflow so transition fires\n  void drawer.offsetWidth;\n  drawer.classList.add('is-open');\n  wireDrawerHandlers(pageId, phases, phaseId);\n\n  // Scroll the drawer comfortably into view (sticky nav offset = 64).\n  setTimeout(() => {\n    const card = drawer.querySelector('.drawer-card');\n    if (!card) return;\n    const top = card.getBoundingClientRect().top + window.pageYOffset - 90;\n    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });\n  }, 120);\n}\n\nfunction wireDrawerHandlers(pageId, phases, phaseId) {\n  const p = phases.find(x => x.id === phaseId);\n  const drawer = document.getElementById(pageId === 'edra' ? 'edraDrawer' : 'hwwDrawer');\n\n  // Close button\n  const closeBtn = drawer.querySelector('[data-action=\"close\"]');\n  if (closeBtn) closeBtn.addEventListener('click', () => togglePhase(pageId, phases, phaseId));\n\n  // Activity expand toggle\n  drawer.querySelectorAll('.act').forEach(el => {\n    if (el.classList.contains('no-expand')) return;  // static row, nothing to expand\n    function fire() {\n      const wasOpen = el.classList.contains('is-open');\n      drawer.querySelectorAll('.act').forEach(other => {\n        if (other !== el) {\n          other.classList.remove('is-open');\n          other.setAttribute('aria-expanded', 'false');\n        }\n      });\n      el.classList.toggle('is-open', !wasOpen);\n      el.setAttribute('aria-expanded', wasOpen ? 'false' : 'true');\n    }\n    el.addEventListener('click', fire);\n    el.addEventListener('keydown', (e) => {\n      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(); }\n    });\n  });\n\n  // Dimension spine wiring (only for evaluate phase)\n  if (p && p.isDimensions) {\n    wireDimensionSpine(p, drawer);\n  }\n\n  // §01 pillars + §05 dashboard tiles — independent click/keyboard expand\n  // (CSS also reveals on hover for pointer devices).\n  drawer.querySelectorAll('.pillar, .dtile').forEach(el => {\n    function fire() {\n      const open = el.classList.toggle('is-open');\n      el.setAttribute('aria-expanded', open ? 'true' : 'false');\n    }\n    el.addEventListener('click', fire);\n    el.addEventListener('keydown', (e) => {\n      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fire(); }\n    });\n  });\n\n  // §01 folded \"where it goes wrong\" reveal\n  const foldBar = drawer.querySelector('.foldout-bar');\n  if (foldBar) {\n    foldBar.addEventListener('click', () => {\n      const fold = foldBar.closest('.foldout');\n      const open = fold.classList.toggle('is-open');\n      foldBar.setAttribute('aria-expanded', open ? 'true' : 'false');\n    });\n  }\n\n  // §03 difference diagram — activation highlights a flow direction\n  const diff = drawer.querySelector('#diffViz');\n  if (diff) {\n    drawer.querySelectorAll('.diff-act').forEach(btn => {\n      btn.addEventListener('click', () => {\n        const dir = btn.dataset.dir;\n        const already = btn.classList.contains('is-active');\n        drawer.querySelectorAll('.diff-act').forEach(b => { b.classList.remove('is-active'); b.setAttribute('aria-pressed', 'false'); });\n        diff.classList.remove('flow-data', 'flow-org');\n        if (!already) {\n          btn.classList.add('is-active');\n          btn.setAttribute('aria-pressed', 'true');\n          diff.classList.add(dir === 'data' ? 'flow-data' : 'flow-org');\n        }\n      });\n    });\n  }\n}\n\nfunction wireDimensionSpine(p, drawer) {\n  const spine = drawer.querySelector('#dimSpine');\n  const arcSvg = drawer.querySelector('#cxArcs');\n  if (!spine || !arcSvg) return;\n\n  const state = { activeDim: null, activeCross: null, arcGroups: {} };\n\n  // ---------- secondary arcs ----------\n  const SECONDARY = [\n    ['architecture', 'masterdata'],\n    ['architecture', 'process'],\n    ['architecture', 'governance'],\n    ['quality', 'process'],\n    ['quality', 'governance'],\n    ['masterdata', 'governance']\n  ];\n  const idxOf = {};\n  p.dims.forEach((d, i) => { idxOf[d.id] = i; });\n  const dimShort = id => (p.dims.find(d => d.id === id) || {}).short;\n\n  function drawArcs() {\n    arcSvg.innerHTML = '';\n    state.arcGroups = {};\n    const dots = [...spine.querySelectorAll('.cx-dim-dot')];\n    if (dots.length < 5) return;\n    const wrap = arcSvg.getBoundingClientRect();\n    if (wrap.width === 0) return;\n    const H = 260;\n    arcSvg.setAttribute('viewBox', `0 0 ${wrap.width} ${H}`);\n    arcSvg.setAttribute('preserveAspectRatio', 'none');\n\n    const xPositions = {};\n    p.dims.forEach((d, i) => {\n      const r = dots[i].getBoundingClientRect();\n      xPositions[d.id] = (r.left + r.width / 2) - wrap.left;\n    });\n\n    const ns = 'http://www.w3.org/2000/svg';\n    SECONDARY.forEach(([from, to]) => {\n      const key = from + ':' + to;\n      const x1 = xPositions[from], x2 = xPositions[to];\n      if (x1 == null || x2 == null) return;\n      const span = Math.abs(idxOf[to] - idxOf[from]);\n      // Depth must keep the curve's lowest point + label inside the SVG\n      // (height H above). With a quadratic Bezier whose start/end y=4 and\n      // control y=ctrl, the midpoint visible bottom is ~ ctrl/2 + 2.\n      // depth scale tuned to fit ≤4-span arcs in 260px.\n      const depth = 40 + span * 20;\n      const ctrl = depth * 1.5;       // control point y\n      const midX = (x1 + x2) / 2;\n      const d = `M ${x1} 4 Q ${midX} ${ctrl} ${x2} 4`;\n      const labelY = Math.min(H - 8, depth + 22);\n\n      const g = document.createElementNS(ns, 'g');\n      g.setAttribute('class', 'cx-arc-group');\n      g.dataset.cross = key;\n\n      const hit = document.createElementNS(ns, 'path');\n      hit.setAttribute('class', 'cx-arc-hit');\n      hit.setAttribute('d', d);\n\n      const vis = document.createElementNS(ns, 'path');\n      vis.setAttribute('class', 'cx-arc');\n      vis.setAttribute('d', d);\n      vis.setAttribute('pathLength', '1');\n\n      const label = document.createElementNS(ns, 'text');\n      label.setAttribute('class', 'cx-arc-label');\n      label.setAttribute('x', String(midX));\n      label.setAttribute('y', String(labelY));\n      label.textContent = dimShort(from) + ' \\u2192 ' + dimShort(to);\n\n      g.appendChild(hit);\n      g.appendChild(vis);\n      g.appendChild(label);\n      arcSvg.appendChild(g);\n      state.arcGroups[key] = g;\n\n      g.addEventListener('click', () => {\n        if (!g.classList.contains('is-revealed')) return;\n        selectCrossing(key);\n      });\n    });\n  }\n\n  function revealArcsForDim(id) {\n    Object.entries(state.arcGroups).forEach(([key, g]) => {\n      const [a, b] = key.split(':');\n      g.classList.toggle('is-revealed', a === id || b === id);\n      g.classList.remove('is-open');\n    });\n  }\n  function hideAllArcs() {\n    Object.values(state.arcGroups).forEach(g => {\n      g.classList.remove('is-revealed', 'is-open');\n    });\n  }\n\n  function selectDim(id) {\n    if (state.activeDim === id) {\n      state.activeDim = null; state.activeCross = null;\n      spine.classList.remove('has-active-dim');\n      spine.querySelectorAll('.cx-dim').forEach(b => { b.classList.remove('is-active', 'is-flank'); b.setAttribute('aria-pressed', 'false'); });\n      spine.querySelectorAll('.cx-prim').forEach(b => { b.classList.remove('is-open'); b.setAttribute('aria-pressed', 'false'); });\n      hideAllArcs();\n      renderDimensionDetail(p, null);\n      return;\n    }\n    state.activeDim = id; state.activeCross = null;\n    spine.classList.add('has-active-dim');\n    spine.querySelectorAll('.cx-dim').forEach(b => {\n      const on = b.dataset.dim === id;\n      b.classList.toggle('is-active', on);\n      b.classList.remove('is-flank');\n      b.setAttribute('aria-pressed', on ? 'true' : 'false');\n    });\n    spine.querySelectorAll('.cx-prim').forEach(b => { b.classList.remove('is-open'); b.setAttribute('aria-pressed', 'false'); });\n    revealArcsForDim(id);\n    renderDimensionDetail(p, id);\n  }\n\n  function selectCrossing(key) {\n    if (state.activeCross === key) {\n      // Toggle off: keep active dim if there was one\n      state.activeCross = null;\n      Object.values(state.arcGroups).forEach(g => g.classList.remove('is-open'));\n      spine.querySelectorAll('.cx-prim').forEach(b => { b.classList.remove('is-open'); b.setAttribute('aria-pressed', 'false'); });\n      if (state.activeDim) renderDimensionDetail(p, state.activeDim);\n      else renderDimensionDetail(p, null);\n      return;\n    }\n    const cross = (p.crossings || {})[key];\n    if (!cross) return;\n    state.activeCross = key;\n    if (cross.kind === 'primary') {\n      // Clear active dim, highlight flanks of this primary\n      const [a, b] = key.split(':');\n      state.activeDim = null;\n      spine.classList.remove('has-active-dim');\n      spine.querySelectorAll('.cx-dim').forEach(d => {\n        const isFlank = (d.dataset.dim === a || d.dataset.dim === b);\n        d.classList.remove('is-active');\n        d.classList.toggle('is-flank', isFlank);\n        d.setAttribute('aria-pressed', 'false');\n      });\n      spine.querySelectorAll('.cx-prim').forEach(b2 => {\n        const on = b2.dataset.cross === key;\n        b2.classList.toggle('is-open', on);\n        b2.setAttribute('aria-pressed', on ? 'true' : 'false');\n      });\n      hideAllArcs();\n    } else {\n      // Secondary: keep active dim, highlight this arc\n      Object.entries(state.arcGroups).forEach(([k, g]) => {\n        g.classList.toggle('is-open', k === key);\n      });\n    }\n    renderDimensionDetail(p, key);\n  }\n\n  spine.querySelectorAll('.cx-dim').forEach(btn => {\n    btn.addEventListener('click', () => selectDim(btn.dataset.dim));\n  });\n  spine.querySelectorAll('.cx-prim').forEach(btn => {\n    btn.addEventListener('click', () => selectCrossing(btn.dataset.cross));\n  });\n\n  // Initial: no selection, empty hint visible\n  renderDimensionDetail(p, null);\n\n  // Draw arcs once layout settles, then on resize\n  function settle() {\n    requestAnimationFrame(() => {\n      const w = arcSvg.getBoundingClientRect().width;\n      if (w === 0) { setTimeout(settle, 80); return; }\n      drawArcs();\n    });\n  }\n  settle();\n  if (typeof ResizeObserver !== 'undefined') {\n    const ro = new ResizeObserver(() => drawArcs());\n    ro.observe(arcSvg);\n  }\n  // Pre-select Architecture for an immediate populated state (matches V2 affordance).\n  setTimeout(() => { if (!state.activeDim && !state.activeCross) selectDim('architecture'); }, 240);\n}\n\n/* ---------- Particles (subtle motion along the track) ---------- */\nfunction initParticles(containerId) {\n  const wrap = document.getElementById(containerId);\n  if (!wrap) return;\n  wrap.innerHTML = '';\n  for (let i = 0; i < 4; i++) {\n    const dot = document.createElement('div');\n    dot.className = 'particle';\n    dot.style.animationDelay = (-i * 4.5) + 's';\n    wrap.appendChild(dot);\n  }\n}\n\n/* ---------- Count-up for stat numbers ---------- */\nfunction easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }\nfunction animateCount(el) {\n  const target = parseInt(el.getAttribute('data-count') || '0', 10);\n  if (!target) { el.textContent = '0'; return; }\n  const duration = 1400;\n  const start = performance.now();\n  function tick(now) {\n    const t = Math.min(1, (now - start) / duration);\n    const v = Math.round(easeOutCubic(t) * target);\n    el.textContent = String(v);\n    if (t < 1) requestAnimationFrame(tick);\n  }\n  requestAnimationFrame(tick);\n}\n\n/* ---------- Page routing ---------- */\nfunction routeFromHash() {\n  const h = (window.location.hash || '').replace(/^#/, '');\n  const isHww = (h === 'how-we-work' || METHOD.some(m => m.id === h));\n  document.querySelectorAll('.page-view').forEach(v => {\n    v.classList.toggle('is-active', isHww ? (v.id === 'page-view-hww') : (v.id === 'page-view-edra'));\n  });\n  document.getElementById('navAssessment').classList.toggle('is-current', !isHww);\n  document.getElementById('navHww').classList.toggle('is-current', isHww);\n\n  // If hash is a phase id, open that phase\n  const phases = isHww ? METHOD : DOCTRINE;\n  const pageId = isHww ? 'hww' : 'edra';\n  const target = phases.find(p => p.id === h);\n  if (target) {\n    // Allow render to settle, then open phase\n    setTimeout(() => togglePhase(pageId, phases, target.id), 60);\n  } else {\n    window.scrollTo(0, 0);\n  }\n}\n\n/* ---------- Init ---------- */\nfunction __initV3() {\n  renderPipeline('edra', DOCTRINE, document.getElementById('edraPipeline'));\n  renderPipeline('hww',  METHOD,   document.getElementById('hwwPipeline'));\n  initParticles('edraParticles');\n  initParticles('hwwParticles');\n\n  // Count-up when stat-strip enters viewport (page 1 only)\n  if ('IntersectionObserver' in window) {\n    const io = new IntersectionObserver((entries) => {\n      entries.forEach(e => {\n        if (e.isIntersecting) {\n          e.target.querySelectorAll('.count-up').forEach(animateCount);\n          io.unobserve(e.target);\n        }\n      });\n    }, { threshold: 0.35 });\n    document.querySelectorAll('.stat-strip').forEach(s => io.observe(s));\n  } else {\n    document.querySelectorAll('.count-up').forEach(el => { el.textContent = el.getAttribute('data-count') || '0'; });\n  }\n\n  window.addEventListener('hashchange', routeFromHash);\n  routeFromHash();\n}\n// Bundler may inject this script after DOMContentLoaded has already fired —\n// run init immediately in that case, otherwise wait for it.\nif (document.readyState === 'loading') {\n  document.addEventListener('DOMContentLoaded', __initV3);\n} else {\n  __initV3();\n}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
